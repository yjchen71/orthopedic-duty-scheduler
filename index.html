<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>骨科值班系統</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="config.js"></script>
<style>
/* ─── Layout: sidebar nav + main content, mobile stacks ─── */
:root {
  --bg: #f7f8fa;
  --surface: #ffffff;
  --surface2: #f0f2f5;
  --border: #e2e6ec;
  --fg: #1a1d23;
  --fg2: #5a6072;
  --fg3: #8c93a3;
  --accent: #2563c8;
  --accent-light: #dbeafe;
  --accent-dark: #1a46a0;
  --sidebar-bg: #e8eaed;
  --sidebar-fg: #2a3040;
  --sidebar-fg2: #6b7280;
  --sidebar-border: #c0c4cc;
  --sidebar-active-bg: rgba(37,99,200,0.12);
  --sidebar-active-fg: #1a46a0;
  --sidebar-hover: rgba(0,0,0,0.06);
  --sidebar-logo: #2563c8;
  --success: #16a34a;
  --success-light: #dcfce7;
  --warn: #d97706;
  --warn-light: #fef3c7;
  --danger: #dc2626;
  --danger-light: #fee2e2;

  --radius: 10px;
  --radius-sm: 6px;
  --font: 'Noto Sans TC', system-ui, sans-serif;
  --mono: 'JetBrains Mono', monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2d3148;
    --fg: #e8eaf0;
    --fg2: #9ba3bc;
    --fg3: #6b7494;
    --accent: #4b82f0;
    --accent-light: #1e2f5a;
    --accent-dark: #6b9af8;
    --sidebar-bg: #e8eaed;
    --sidebar-fg: #2a3040;
    --sidebar-fg2: #6b7280;
    --sidebar-border: #c0c4cc;
    --sidebar-active-bg: rgba(37,99,200,0.12);
    --sidebar-active-fg: #1a46a0;
    --sidebar-hover: rgba(0,0,0,0.06);
    --sidebar-logo: #2563c8;
    --success: #22c55e;
    --success-light: #14391e;
    --warn: #f59e0b;
    --warn-light: #3a2800;
    --danger: #f87171;
    --danger-light: #3b1212;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #22263a;
  --border: #2d3148;
  --fg: #e8eaf0;
  --fg2: #9ba3bc;
  --fg3: #6b7494;
  --accent: #4b82f0;
  --accent-light: #1e2f5a;
  --accent-dark: #6b9af8;
  --sidebar-bg: #e8eaed;
  --sidebar-fg: #2a3040;
  --sidebar-fg2: #6b7280;
  --sidebar-border: #c0c4cc;
  --sidebar-active-bg: rgba(37,99,200,0.12);
  --sidebar-active-fg: #1a46a0;
  --sidebar-hover: rgba(0,0,0,0.06);
  --sidebar-logo: #2563c8;
  --success: #22c55e;
  --success-light: #14391e;
  --warn: #f59e0b;
  --warn-light: #3a2800;
  --danger: #f87171;
  --danger-light: #3b1212;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--fg);
  min-height: 100%;
  display: flex;
  flex-direction: column;
  padding-left: max(0px, env(safe-area-inset-left, 0px));
  padding-right: max(0px, env(safe-area-inset-right, 0px));
  position: relative;
  overflow-x: hidden;
}

/* topbar / cards float above grid */
.topbar, .page, .card, .stat-card, .modal-overlay { position: relative; z-index: 1; }

/* ─── App Shell ─── */
.app {
  display: flex;
  min-height: 100vh;
}

/* ─── Sidebar ─── */
.sidebar {
  width: 220px;
  flex-shrink: 0;
  background: linear-gradient(160deg,
    #f8f9fa 0%, #e8eaed 12%, #f4f5f7 25%, #d8dadf 40%,
    #eceef1 55%, #c8cace 70%, #dfe1e5 85%, #b8bcc4 100%);
  border-right: 1px solid #c0c4cc;
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}

.sidebar-logo {
  padding: 20px 20px 16px;
  border-bottom: 1px solid var(--sidebar-border);
}

.sidebar-logo .logo-mark {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  color: var(--sidebar-logo);
  text-transform: uppercase;
  margin-bottom: 2px;
}

.sidebar-logo h1 {
  font-size: 15px;
  color: var(--sidebar-fg);
  font-weight: 700;
  color: var(--fg);
  line-height: 1.3;
}

.nav {
  padding: 12px 8px;
  flex: 1;
}

.nav-section-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--sidebar-fg2);
  padding: 8px 12px 4px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  color: var(--sidebar-fg);
  transition: background 0.15s, color 0.15s;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
}

.nav-item:hover { background: var(--sidebar-hover); color: #fff; }
.nav-item.active { background: var(--sidebar-active-bg); color: var(--sidebar-active-fg); font-weight: 600; }

.nav-item .icon { font-size: 16px; flex-shrink: 0; }

.nav-badge {
  margin-left: auto;
  background: var(--danger);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 99px;
}

/* ─── Main ─── */
.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  position: relative;
  /* Crumpled paper base color */
  background-color: #f0ece4;
  /* Paper texture: subtle diagonal fiber lines + light/shadow patches */
  background-image:
    /* Fine grain overlay */
    repeating-linear-gradient(
      47deg,
      transparent 0px, transparent 2px,
      rgba(180,160,130,0.03) 2px, rgba(180,160,130,0.03) 3px
    ),
    repeating-linear-gradient(
      -38deg,
      transparent 0px, transparent 3px,
      rgba(200,185,160,0.04) 3px, rgba(200,185,160,0.04) 4px
    ),
    /* Crumple highlight/shadow patches */
    radial-gradient(ellipse 60% 20% at 20% 15%, rgba(255,252,245,0.55) 0%, transparent 70%),
    radial-gradient(ellipse 40% 25% at 75% 30%, rgba(220,210,195,0.4) 0%, transparent 65%),
    radial-gradient(ellipse 50% 15% at 55% 60%, rgba(255,250,240,0.45) 0%, transparent 70%),
    radial-gradient(ellipse 35% 30% at 10% 70%, rgba(210,200,185,0.35) 0%, transparent 65%),
    radial-gradient(ellipse 45% 20% at 85% 80%, rgba(240,235,225,0.5) 0%, transparent 70%),
    radial-gradient(ellipse 60% 40% at 40% 90%, rgba(255,252,245,0.4) 0%, transparent 65%),
    /* Subtle warm-tone crease lines */
    repeating-linear-gradient(
      112deg,
      transparent 0px, transparent 60px,
      rgba(170,150,120,0.025) 60px, rgba(170,150,120,0.025) 61px
    ),
    repeating-linear-gradient(
      68deg,
      transparent 0px, transparent 90px,
      rgba(160,140,110,0.02) 90px, rgba(160,140,110,0.02) 91px
    );
}

.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px max(20px, env(safe-area-inset-right, 0px)) 14px 24px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.topbar-title { font-size: 17px; font-weight: 700; flex: 1; }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 600;
  font-family: var(--font);
  cursor: pointer;
  border: none;
  transition: opacity 0.15s, background 0.15s;
}
.btn:active { opacity: 0.8; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-dark); }
.btn-secondary { background: var(--surface2); color: var(--fg); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--border); }
.btn-danger { background: var(--danger-light); color: var(--danger); }
.btn-success { background: var(--success-light); color: var(--success); }
.btn-sm { padding: 5px 10px; font-size: 12px; }

.page { padding: 24px; flex: 1; }

/* ─── Cards / panels ─── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}

.card-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.card-header h2 { font-size: 15px; font-weight: 700; }
.card-body { padding: 20px; }

/* ─── Stats row ─── */
.stats-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 14px;
  margin-bottom: 24px;
}

.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 20px;
}

.stat-label { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg3); margin-bottom: 6px; }
.stat-value { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.stat-sub { font-size: 12px; color: var(--fg2); margin-top: 4px; }

/* ─── Table ─── */
.table-wrap { overflow-x: auto; }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th {
  background: var(--surface2);
  text-align: left;
  padding: 9px 14px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--fg3);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
tbody tr { border-bottom: 1px solid var(--border); }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: var(--surface2); }
tbody td { padding: 10px 14px; vertical-align: middle; }

/* ─── Chips / badges ─── */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 9px;
  border-radius: 99px;
  font-size: 11px;
  font-weight: 600;
}
.chip-blue { background: var(--accent-light); color: var(--accent); }
.chip-green { background: var(--success-light); color: var(--success); }
.chip-orange { background: var(--warn-light); color: var(--warn); }
.chip-red { background: var(--danger-light); color: var(--danger); }
.chip-gray { background: var(--surface2); color: var(--fg2); }

/* ─── Calendar grid for schedule ─── */
.cal-outer { overflow-x: auto; }

.schedule-table { min-width: 900px; width: 100%; border-collapse: collapse; font-size: 12px; }
.schedule-table th {
  background: var(--surface2);
  padding: 8px 10px;
  text-align: center;
  border: 1px solid var(--border);
  font-size: 11px;
  font-weight: 700;
  color: var(--fg2);
  white-space: nowrap;
}
.schedule-table td {
  border: 1px solid var(--border);
  padding: 5px 6px;
  vertical-align: top;
  min-width: 80px;
}
.day-header {
  background: var(--surface2);
  font-weight: 700;
  font-size: 12px;
  text-align: center;
  padding: 6px 4px;
}
.day-header.weekend { background: var(--accent-light); color: var(--accent); }
.day-header.holiday-col { background: var(--warn-light); color: var(--warn); }

.slot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  padding: 3px 6px;
  border-radius: 4px;
  margin-bottom: 2px;
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  transition: opacity 0.15s;
}
.slot:hover { opacity: 0.8; }
.slot.ward { background: #dbeafe; color: #1d4ed8; }
.slot.er { background: #dcfce7; color: #15803d; }
.slot.trauma { background: #fce7f3; color: #be185d; }
.slot.pgy { background: #fef9c3; color: #a16207; }
.slot.liu-yuan { background: #ede9fe; color: #6d28d9; }
.slot.pinri { background: #e0f2fe; color: #0369a1; }
.slot.jiari { background: #fef3c7; color: #b45309; }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .slot.ward { background: #1e3a6e; color: #93c5fd; }
  :root:not([data-theme="light"]) .slot.er { background: #14391e; color: #86efac; }
  :root:not([data-theme="light"]) .slot.trauma { background: #4a1230; color: #f9a8d4; }
  :root:not([data-theme="light"]) .slot.pgy { background: #3b2800; color: #fde047; }
  :root:not([data-theme="light"]) .slot.liu-yuan { background: #2e1065; color: #c4b5fd; }
  :root:not([data-theme="light"]) .slot.pinri { background: #0c2a3a; color: #7dd3fc; }
  :root:not([data-theme="light"]) .slot.jiari { background: #3a2000; color: #fcd34d; }
}
:root[data-theme="dark"] .slot.ward { background: #1e3a6e; color: #93c5fd; }
:root[data-theme="dark"] .slot.er { background: #14391e; color: #86efac; }
:root[data-theme="dark"] .slot.trauma { background: #4a1230; color: #f9a8d4; }
:root[data-theme="dark"] .slot.pgy { background: #3b2800; color: #fde047; }
:root[data-theme="dark"] .slot.liu-yuan { background: #2e1065; color: #c4b5fd; }
:root[data-theme="dark"] .slot.pinri { background: #0c2a3a; color: #7dd3fc; }
:root[data-theme="dark"] .slot.jiari { background: #3a2000; color: #fcd34d; }

.slot .remove-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: inherit;
  opacity: 0.6;
  font-size: 12px;
  padding: 0;
  display: none;
}
.slot:hover .remove-btn { display: block; }

.add-slot-btn {
  width: 100%;
  border: none;
  background: none;
  cursor: pointer;
  color: var(--fg3);
  font-size: 11px;
  padding: 3px 0;
  text-align: center;
  border-radius: 4px;
  display: none;
}
td:hover .add-slot-btn { display: block; }
.add-slot-btn:hover { background: var(--surface2); }

/* ─── Reply form (doctor view) ─── */
.form-section { max-width: 600px; margin: 0 auto; }

.form-group { margin-bottom: 20px; }
.form-label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 6px;
  color: var(--fg);
}
.form-hint { font-size: 11px; color: var(--fg3); margin-bottom: 8px; }

.day-picker {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.day-btn {
  width: 38px;
  height: 38px;
  border-radius: var(--radius-sm);
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--fg);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.12s;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font);
  font-variant-numeric: tabular-nums;
}

.day-btn:hover { border-color: var(--accent); color: var(--accent); }
.day-btn.selected { background: var(--danger); border-color: var(--danger); color: #fff; }
.day-btn.weekend { border-color: var(--accent-light); color: var(--accent); }
.day-btn.weekend.selected { background: var(--danger); border-color: var(--danger); color: #fff; }
.day-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.day-btn.has-weekend-warning { background: var(--warn-light); border-color: var(--warn); }

.warning-box {
  background: var(--danger-light);
  border: 1px solid var(--danger);
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  font-size: 13px;
  color: var(--danger);
  display: none;
  margin-top: 12px;
}

.info-box {
  background: var(--accent-light);
  border: 1px solid var(--accent);
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  font-size: 13px;
  color: var(--accent);
  margin-bottom: 20px;
}

/* ─── Email log ─── */
.email-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
}
.email-item:last-child { border-bottom: none; }
.email-avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--accent-light);
  color: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 700;
  flex-shrink: 0;
}

/* ─── Modal ─── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 20px;
}
.modal {
  background: var(--surface);
  border-radius: var(--radius);
  width: 100%;
  max-width: 460px;
  max-height: 80vh;
  overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
.modal-header {
  padding: 18px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modal-header h3 { font-size: 16px; font-weight: 700; }
.modal-close {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--fg3);
  font-size: 20px;
  line-height: 1;
  padding: 0;
}
.modal-body { padding: 20px; }
.modal-footer {
  padding: 16px 20px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 10px;
  justify-content: flex-end;
}

/* ─── Progress ─── */
.progress-bar {
  height: 6px;
  background: var(--surface2);
  border-radius: 99px;
  overflow: hidden;
  margin-top: 6px;
}
.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 99px;
  transition: width 0.4s;
}

/* ─── Tabs ─── */
.tabs {
  display: flex;
  gap: 0;
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  background: var(--surface);
}
.tab-btn {
  padding: 12px 16px;
  font-size: 13px;
  font-weight: 600;
  color: var(--fg3);
  border: none;
  background: none;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  font-family: var(--font);
  transition: color 0.15s;
}
.tab-btn:hover { color: var(--fg); }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

/* ─── Topbar hamburger (mobile) ─── */
.hamburger {
  display: none;
  background: none;
  border: none;
  cursor: pointer;
  color: var(--fg);
  font-size: 22px;
  padding: 0;
}

.sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 49; }

@media (max-width: 700px) {
  .sidebar {
    position: fixed;
    left: 0; top: 0;
    height: 100%;
    z-index: 50;
    transform: translateX(-100%);
    transition: transform 0.25s;
  }
  .sidebar.open { transform: translateX(0); }
  .hamburger { display: flex; }
  .sidebar-overlay.active { display: block; }
  .page { padding: 16px; }
  .topbar { padding-left: 16px; }
  .stats-row { grid-template-columns: 1fr 1fr; }
}

/* ─── Select ─── */
select, input[type="text"], input[type="email"] {
  width: 100%;
  background: var(--surface);
  border: 1.5px solid var(--border);
  color: var(--fg);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  font-size: 14px;
  font-family: var(--font);
  outline: none;
  transition: border-color 0.15s;
}
select:focus, input:focus { border-color: var(--accent); }

/* ─── Notification dot ─── */
.dot-pulse {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--danger);
}

/* ─── Validation summary ─── */
.validation-list { list-style: none; }
.validation-list li {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 0;
  font-size: 13px;
  border-bottom: 1px solid var(--border);
}
.validation-list li:last-child { border-bottom: none; }

.assign-pill {
  display: inline-block;

<script>
// ─── State ───────────────────────────────────────────────────────────────────
// Shift types: Ward (指定日期, 7人負責), ER (每天, 10人), Trauma (指定日期, 3人)
const SHIFTS = ['Ward','ER','Trauma'];
const SHIFT_CLASS = { 'Ward':'ward', 'ER':'er', 'Trauma':'trauma' };

// Staff role groups
const WARD_STAFF  = ['江毅彥','張書豪','徐得愷','羅文鴻','洪嘉鴻','葉炳君','李元甫'];
const TRAUMA_STAFF = ['陳勇璋','李宗霖','王俊量'];

const DOW = ['日','一','二','三','四','五','六'];

const STAFF = [
  {id:'江毅彥', email:'', color:'#3b82f6'},
  {id:'張書豪', email:'', color:'#10b981'},
  {id:'徐得愷', email:'', color:'#8b5cf6'},
  {id:'陳勇璋', email:'', color:'#f59e0b'},
  {id:'王俊量', email:'', color:'#ef4444'},
  {id:'羅文鴻', email:'', color:'#06b6d4'},
  {id:'洪嘉鴻', email:'', color:'#d946ef'},
  {id:'葉炳君', email:'', color:'#84cc16'},
  {id:'李元甫', email:'', color:'#f97316'},
  {id:'李宗霖', email:'', color:'#6366f1'},
];

// ─── Holiday helpers ─────────────────────────────────────────────────────────
function getMonthKey() {
  const {year, month} = state.currentMonth;
  return `${year}-${month}`;
}

function isHoliday(year, month, day) {
  // Base: Sat/Sun
  const dow = new Date(year, month-1, day).getDay();
  const isWeekend = (dow === 0 || dow === 6);
  const key = `${year}-${month}`;
  const extra = (state?.secretarySettings?.holidays?.[key] || []);
  const workday = (state?.secretarySettings?.extraWorkdays?.[key] || []);
  // Extra national holidays count as holiday;補班 workdays override weekend
  if (workday.includes(day)) return false;
  return isWeekend || extra.includes(day);
}

// Read year/month from URL hash (#year=YYYY&month=MM) or query string
function getUserFromURL() {
  try { return new URLSearchParams(location.search).get('user') || ''; }
  catch(e) { return ''; }
}
function getMonthFromURL() {
  // Try hash format: #fill/YYYY/MM
  try {
    const h = location.hash || '';
    const m = h.match(/#fill-(\d{4})-(\d{2})/);
    if (m) {
      const y = parseInt(m[1]), mo = parseInt(m[2]);
      if (y && mo >= 1 && mo <= 12) return {year: y, month: mo};
    }
  } catch(e) {}
  // Fallback: query string
  try {
    const p = new URLSearchParams(location.search);
    const y = parseInt(p.get('year')), mo = parseInt(p.get('month'));
    if (y && mo >= 1 && mo <= 12) return {year: y, month: mo};
  } catch(e) {}
  return null;
}

let state = loadState();

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem('schedule-app-v2') || 'null');
    if (s) return s;
  } catch(e) {}
  // Default state — pre-load Nov 2026 schedule
  return {
    currentMonth: {year: 2026, month: 11},
    staff: STAFF.map(s => ({...s, email: s.id+'@hospital.tw'})),
    // replies now stored in db (replies/{month}/doctors/{name})
    schedule: {
      '2026-11': buildNov2026Schedule()
    },
    emailLog: [],
    autoScheduled: true,
    secretaryEmail: '',
    // 秘書設定
    secretarySettings: {
      traumaPreset: {},     // {year-month: {day: name}} 秘書預設 trauma
      wardPreset: {},       // {year-month: [days]} 秘書指定 ward 班日期
      fixedAssign: {},      // {year-month: {type: {day: name}}} 秘書指定特定天特定人 (trauma/ward/er)
      holidays: {},         // {year-month: [days]} 國定假日/補班（額外假日）
      extraWorkdays: {},    // {year-month: [days]} 補班（原本是假日但需上班）
    },
    notifyLog: {},
  };
}

// Pre-computed November 2026 schedule (verified, all constraints satisfied)
function buildNov2026Schedule() {
  const trauma = {1:'王俊量', 9:'李宗霖', 15:'陳勇璋', 19:'王俊量', 22:'陳勇璋', 25:'李宗霖'};
  const ward   = {2:'江毅彥', 4:'葉炳君', 7:'洪嘉鴻', 8:'葉炳君', 10:'洪嘉鴻', 12:'李元甫',
                  14:'羅文鴻', 17:'張書豪', 20:'江毅彥', 21:'張書豪', 28:'李元甫', 29:'徐得愷'};
  const freeER = {3:'羅文鴻', 5:'王俊量', 6:'李元甫', 11:'徐得愷', 13:'江毅彥', 16:'羅文鴻',
                  18:'徐得愷', 23:'張書豪', 24:'洪嘉鴻', 26:'陳勇璋', 27:'李宗霖', 30:'葉炳君'};
  const sched = {};
  for (let d = 1; d <= 30; d++) {
    sched[d] = {};
    if (trauma[d]) sched[d]['Trauma'] = trauma[d];
    if (ward[d])   sched[d]['Ward']   = ward[d];
    // ER: coupled from trauma or ward, otherwise free
    sched[d]['ER'] = trauma[d] || ward[d] || freeER[d];
  }
  return sched;
}

// ─── Supabase-backed data layer ───────────────────────────────────────────────
// replies table: (month 'YYYY-MM', doctor_name) -> off_days[], prefer_days[]
// Doctors (anonymous) write through the submit_reply RPC; the secretary signs in
// with Supabase Auth and reads/writes tables directly (see supabase/schema.sql).
const APP_VERSION = '2026-11-25-rulesets';
const sb = window.supabase.createClient(window.APP_CONFIG.SUPABASE_URL, window.APP_CONFIG.SUPABASE_ANON_KEY);
let dbReplies = {};          // { name: { offDays, preferDays, submittedAt } }
let _isSecretary = false;
let _dbChan = null;
let _curMonthKey = null;
let monthLocked = false;     // secretary view: is the current month's reply form locked?

function getMonthKey(year, month) {
  const {year: y, month: m} = (year == null) ? state.currentMonth : {year, month};
  return `${y}-${String(m).padStart(2,'0')}`;
}

function getReplies() { return dbReplies; }

async function loadReplies(monthKey) {
  const {data, error} = await sb.from('replies').select('*').eq('month', monthKey);
  if (error) { console.warn('load replies failed', error); showToast('⚠️ 讀取回覆失敗：' + error.message); return; }
  if (monthKey !== _curMonthKey) return;       // user already switched month
  const fresh = {};
  data.forEach(r => { fresh[r.doctor_name] = {
    offDays: r.off_days || [], preferDays: r.prefer_days || [],
    submittedAt: new Date(r.submitted_at).getTime() }; });
  dbReplies = fresh;
  const lk = await sb.from('month_locks').select('month').eq('month', monthKey).maybeSingle();
  if (monthKey !== _curMonthKey) return;
  monthLocked = !!(lk.data);
  if (currentPage === 'replies' || currentPage === 'dashboard') renderPage(currentPage);
}

async function lockMonth(monthKey) {
  const {error} = await sb.from('month_locks').upsert({month: monthKey});
  if (error) { showToast('⚠️ 鎖定失敗：' + error.message); return; }
  if (monthKey === _curMonthKey) { monthLocked = true; if (currentPage === 'replies') renderPage('replies'); }
}
window.unlockMonth = async function() {
  const monthKey = getMonthKey();
  if (!confirm('解除鎖定後，醫師可以再次修改本月的回覆。確定要解除嗎？')) return;
  const {error} = await sb.from('month_locks').delete().eq('month', monthKey);
  if (error) { showToast('⚠️ 解除失敗：' + error.message); return; }
  monthLocked = false; showToast('🔓 已解除鎖定'); renderPage(currentPage);
};
window.lockMonthNow = async function() {
  if (!confirm('鎖定後，醫師將無法再修改本月的回覆。確定要鎖定嗎？')) return;
  await lockMonth(getMonthKey()); showToast('🔒 已鎖定');
};

function subscribeReplies(monthKey) {
  _curMonthKey = monthKey;
  if (_dbChan) { sb.removeChannel(_dbChan); _dbChan = null; }
  if (!_isSecretary) return;                   // doctors never read the table
  loadReplies(monthKey);
  _dbChan = sb.channel('replies-' + monthKey)
    .on('postgres_changes', {event: '*', schema: 'public', table: 'replies', filter: `month=eq.${monthKey}`},
        () => loadReplies(monthKey))
    .subscribe();
}

const PIN_MSG = {
  bad_pin: '❌ 員工編號錯誤，請再核對',
  locked_out: '🔒 錯誤次數過多，請 15 分鐘後再試，或聯絡秘書',
  no_pin: '⚠️ 尚未設定員工編號，請聯絡秘書',
};
let _doctorPin = '';          // PIN the doctor typed this session (sent with each submit)

async function saveReply(name, offDays, preferDays) {
  const monthKey = getMonthKey(state._fillMonthOverride?.year, state._fillMonthOverride?.month);
  const {data, error} = await sb.rpc('submit_reply', {
    p_month: monthKey, p_name: name, p_off: offDays, p_prefer: preferDays, p_pin: _isSecretary ? null : _doctorPin });
  if (error) throw error;
  if (data !== 'ok') { const e = new Error(data); e.code = data; throw e; }
  dbReplies[name] = {offDays, preferDays, submittedAt: Date.now()};   // so 「修改我的填寫」 shows what was just saved
  if (_isSecretary) loadReplies(monthKey);
}

// Doctor side: verify PIN and fetch one's own previous reply. Returns {status, offDays, preferDays}.
async function fetchMyReply(name, pin) {
  const monthKey = getMonthKey(state._fillMonthOverride?.year, state._fillMonthOverride?.month);
  const {data, error} = await sb.rpc('get_reply', {p_month: monthKey, p_name: name, p_pin: pin});
  if (error || !data) return {status: 'error'};
  return {status: data.status, offDays: data.off_days || [], preferDays: data.prefer_days || []};
}

// Secretary side: manage doctors' PINs
let pinsByName = {};
let _pinsLoaded = false;
async function loadPins() {
  const {data, error} = await sb.from('doctor_pins').select('*');
  if (error) { showToast('⚠️ 讀取 PIN 失敗：' + error.message); return; }
  pinsByName = {}; data.forEach(r => { pinsByName[r.name] = r.pin; });
  _pinsLoaded = true;
}
async function setDoctorPin(name, pin) {
  if (!/^\d{5}$/.test(pin)) { showToast('⚠️ 員工編號需為 5 位數字'); return false; }
  await sb.from('doctors').upsert({name, sort_order: state.staff.findIndex(s => s.id === name)});  // make sure the doctor row exists
  const {error} = await sb.from('doctor_pins').upsert({name, pin});
  if (error) { showToast('⚠️ 儲存 PIN 失敗：' + error.message); return false; }
  pinsByName[name] = pin; return true;
}
window.editPin = async function(i, v) {
  const name = state.staff[i].id; v = v.trim();
  if (v === (pinsByName[name] || '')) return;
  if (!(await setDoctorPin(name, v))) renderStaff();
};
// Bulk import: one "姓名 員工編號" per line (separated by space, comma, tab or colon)
window.importPins = function() {
  const ov = document.createElement('div');
  ov.className = 'modal-overlay';
  ov.innerHTML = `
    <div class="modal" style="max-width:460px;width:92vw">
      <div class="modal-header"><h3>批次匯入員工編號</h3></div>
      <div class="modal-body">
        <p style="font-size:13px;color:var(--fg2);margin-bottom:8px">每行一位，格式：姓名 員工編號（可從 Excel 直接複製兩欄貼上）</p>
        <textarea id="pin-import" rows="10" style="width:100%;font-size:13px;font-family:monospace" placeholder="江毅彥 12345&#10;張書豪 12346"></textarea>
        <div id="pin-import-msg" style="font-size:12px;color:var(--danger);margin-top:6px;min-height:16px"></div>
      </div>
      <div class="modal-footer" style="display:flex;gap:10px">
        <button class="btn btn-secondary" style="flex:1" onclick="this.closest('.modal-overlay').remove()">取消</button>
        <button class="btn btn-primary" style="flex:1" id="pin-import-go">匯入</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  ov.querySelector('#pin-import-go').onclick = async () => {
    const msg = ov.querySelector('#pin-import-msg');
    const names = state.staff.map(s => s.id);
    const rows = ov.querySelector('#pin-import').value.split('\n').map(l => l.trim()).filter(Boolean)
      .map(l => l.split(/[\s,，:：\t]+/).filter(Boolean));
    const bad = rows.filter(r => r.length < 2 || !names.includes(r[0]) || !/^\d{5}$/.test(r[1]));
    if (bad.length) { msg.textContent = '格式或姓名不符：' + bad.map(r => r.join(' ')).join('；'); return; }
    let ok = 0;
    for (const [n, pin] of rows) if (await setDoctorPin(n, pin)) ok++;
    ov.remove(); showToast(`✅ 已匯入 ${ok} 位員工編號`); renderStaff();
  };
};

async function deleteReply(name) {
  const monthKey = getMonthKey();
  const {error} = await sb.from('replies').delete().eq('month', monthKey).eq('doctor_name', name);
  if (error) { showToast('⚠️ 刪除失敗：' + error.message); return; }
  delete dbReplies[name];
}

async function clearMonthReplies() {
  const monthKey = getMonthKey();
  const {error} = await sb.from('replies').delete().eq('month', monthKey);
  if (error) { showToast('⚠️ 清除失敗：' + error.message); return; }
  dbReplies = {};
}

// ─── Secretary state (schedule, staff, settings) synced to app_state ─────────
let _syncTimer = null;
function persistableState() {
  const out = {};
  Object.keys(state).forEach(k => { if (!k.startsWith('_') && k !== 'repliesByMonth') out[k] = state[k]; });
  return out;
}
function saveState() {
  try { localStorage.setItem('schedule-app-v2', JSON.stringify(state)); } catch(e) {}
  if (!_isSecretary) return;
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(syncRemoteState, 800);
}
async function syncRemoteState() {
  const {error} = await sb.from('app_state').upsert({id: 1, data: persistableState(), updated_at: new Date().toISOString()});
  if (error) { showToast('⚠️ 雲端同步失敗：' + error.message); return; }
  // keep the doctor list (used by the fill page) in step with 人員設定
  const names = state.staff.map(s => s.id);
  await sb.from('doctors').upsert(names.map((n, i) => ({name: n, sort_order: i})));
  const {data: existing} = await sb.from('doctors').select('name');
  const stale = (existing || []).map(d => d.name).filter(n => !names.includes(n));
  if (stale.length) await sb.from('doctors').delete().in('name', stale);
}
async function loadRemoteState() {
  const {data, error} = await sb.from('app_state').select('data').eq('id', 1).maybeSingle();
  if (error) { showToast('⚠️ 讀取雲端資料失敗：' + error.message); return; }
  if (data && data.data) { state = Object.assign(state, data.data); try { localStorage.setItem('schedule-app-v2', JSON.stringify(state)); } catch(e) {} }
  else await syncRemoteState();               // first login: seed cloud with current data
}

    g.style.cssText = 'position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px';

  g.innerHTML = `
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:32px;max-width:360px;width:100%;box-shadow:0 4px 20px rgba(0,0,0,.08)">
      <div style="font-size:40px;text-align:center">🔐</div>
      <h2 style="text-align:center;margin:8px 0 20px">秘書登入</h2>
      <input id="auth-email" type="email" placeholder="Email" autocomplete="username" style="width:100%;padding:10px 12px;margin-bottom:10px;border:2px solid var(--border);border-radius:8px;font-size:15px;background:var(--surface);color:var(--fg)">
      <input id="auth-pass" type="password" placeholder="密碼" autocomplete="current-password" style="width:100%;padding:10px 12px;border:2px solid var(--border);border-radius:8px;font-size:15px;background:var(--surface);color:var(--fg)" onkeydown="if(event.key==='Enter')doSignIn()">

      <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="doSignIn()">登入</button>
    </div>`;
}
window.doSignIn = async function() {
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-pass').value;
  const {error} = await sb.auth.signInWithPassword({email, password});
  if (error) { document.getElementById('auth-err').textContent = '❌ 登入失敗：' + error.message; return; }
  location.reload();
};
window.doSignOut = async function() { await sb.auth.signOut(); location.reload(); };

function updateSidebarMonth() {
  const {year, month} = state.currentMonth;
  const el = document.getElementById('sidebar-month-label');
  if (el) el.textContent = `${year}年${month}月`;
}

function shiftMonth(delta) {
  let {year, month} = state.currentMonth;
  month += delta;
  if (month > 12) { month = 1; year++; }
  if (month < 1)  { month = 12; year--; }
  state.currentMonth = {year, month};
  dbReplies = {};
  saveState();
  subscribeReplies(getMonthKey());
  updateSidebarMonth();
  renderPage(currentPage);
}

function getPin() {

}

function showPinDialog(onSuccess) {
  const pin = getPin();
  if (!pin) {
    // No PIN set yet — prompt to set one
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.id = 'pin-dialog';
    overlay.innerHTML = `
      <div class="modal" style="max-width:360px">
        <div class="modal-header">
          <h3>🔐 設定秘書 PIN 碼</h3>
        </div>
        <div class="modal-body">

          <input id="pin-new" type="password" inputmode="numeric" placeholder="輸入 PIN 碼（4～8位數字）"
            style="width:100%;padding:10px 12px;border:2px solid var(--border);border-radius:var(--radius-sm);font-size:18px;letter-spacing:4px;text-align:center;background:var(--surface);color:var(--fg)">
          <input id="pin-confirm" type="password" inputmode="numeric" placeholder="再次確認 PIN 碼"
            style="width:100%;padding:10px 12px;border:2px solid var(--border);border-radius:var(--radius-sm);font-size:18px;letter-spacing:4px;text-align:center;background:var(--surface);color:var(--fg);margin-top:10px">
          <div id="pin-err" style="color:var(--danger);font-size:12px;margin-top:8px;min-height:16px"></div>
        </div>
        <div class="modal-footer" style="display:flex;gap:10px">
          <button class="btn btn-secondary" style="flex:1" onclick="document.getElementById('pin-dialog').remove()">取消</button>
          <button class="btn btn-primary" style="flex:2" onclick="confirmSetPin()">設定並進入</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    document.getElementById('pin-new').focus();
    window._pinSuccessCb = onSuccess;
    window.confirmSetPin = function() {
      const v = document.getElementById('pin-new').value.trim();
      const v2 = document.getElementById('pin-confirm').value.trim();
      const err = document.getElementById('pin-err');
      if (!/^\d{4,8}$/.test(v)) { err.textContent = '請輸入 4～8 位數字'; return; }
      if (v !== v2) { err.textContent = '兩次輸入不一致'; return; }
      if (!state.secretarySettings) state.secretarySettings = {};
      state.secretarySettings.pin = v;
      saveState();
      _pinUnlocked = true;
      document.getElementById('pin-dialog').remove();
      showToast('✅ PIN 碼已設定');
      if (window._pinSuccessCb) window._pinSuccessCb();
    };
    return;
  }
  // PIN already set — ask for it
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'pin-dialog';
  overlay.innerHTML = `
    <div class="modal" style="max-width:320px">
      <div class="modal-header">
        <h3>🔐 秘書驗證</h3>
      </div>
      <div class="modal-body" style="text-align:center">
        <p style="font-size:13px;color:var(--fg2);margin-bottom:16px">請輸入秘書 PIN 碼</p>
        <input id="pin-input" type="password" inputmode="numeric" placeholder="PIN 碼"
          style="width:100%;padding:12px;border:2px solid var(--border);border-radius:var(--radius-sm);font-size:22px;letter-spacing:6px;text-align:center;background:var(--surface);color:var(--fg)"
          onkeydown="if(event.key==='Enter')verifyPin()">
        <div id="pin-err" style="color:var(--danger);font-size:12px;margin-top:8px;min-height:16px"></div>
      </div>
      <div class="modal-footer" style="display:flex;gap:10px">
        <button class="btn btn-secondary" style="flex:1" onclick="document.getElementById('pin-dialog').remove()">取消</button>
        <button class="btn btn-primary" style="flex:2" onclick="verifyPin()">進入</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById('pin-input').focus();
  window._pinSuccessCb = onSuccess;
  window.verifyPin = function() {
    const v = document.getElementById('pin-input').value;
    if (v === getPin()) {
      _pinUnlocked = true;
      document.getElementById('pin-dialog').remove();
      if (window._pinSuccessCb) window._pinSuccessCb();
    } else {
      document.getElementById('pin-err').textContent = '❌ PIN 碼錯誤，請再試一次';
      document.getElementById('pin-input').value = '';
      document.getElementById('pin-input').focus();
    }
  };
}

function showPage(id) {
  _doShowPage(id);
}

function _doShowPage(id) {
  currentPage = id;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(el => {
    if (el.getAttribute('onclick')?.includes(`'${id}'`)) el.classList.add('active');
  });
  document.querySelectorAll('[id^="page-"]').forEach(el => el.hidden = true);
  const pageEl = document.getElementById(`page-${id}`);
  if (pageEl) pageEl.hidden = false;
  document.getElementById('page-title').textContent = PAGE_TITLES[id] || id;

  const actionsEl = document.getElementById('topbar-actions');
  actionsEl.innerHTML = '';

  updateSidebarMonth();
  renderPage(id);
  closeSidebar();
}

function renderPage(id) {
  if (id === 'dashboard') renderDashboard();
  else if (id === 'replies') renderReplies();
  else if (id === 'schedule') renderSchedule();
  else if (id === 'secretary-settings') renderSecretarySettings();
  else if (id === 'email') renderEmail();
  else if (id === 'doctor-reply') renderDoctorReply();
  else if (id === 'staff') renderStaff();
}

function getFillLink() {
  const {year, month} = state.currentMonth;
  const base = location.origin + location.pathname;
  return `${base}?year=${year}&month=${String(month).padStart(2,'0')}`;
}

window.copyFillLink = function(btn) {
  const link = getFillLink();
  navigator.clipboard.writeText(link).then(() => {
    if (btn) { const orig = btn.textContent; btn.textContent = '✅ 已複製！'; setTimeout(() => { btn.textContent = orig; }, 2000); }
    showToast('✅ 連結已複製，可直接貼到 LINE 傳送');
  }).catch(() => {
    const prev = document.getElementById('line-msg-preview');
    if (prev) { prev.innerHTML = `<a href="${link}" target="_blank" style="color:var(--accent);word-break:break-all">${link}</a>`; prev.hidden = false; }
    showToast('⚠️ 自動複製失敗，請點擊下方連結或手動複製');
  });
};

function getViewLink(tab) {
  const {year, month} = state.currentMonth;
  return `${location.origin}${location.pathname}?year=${year}&month=${String(month).padStart(2,'0')}&view=${tab}`;
}

window.copyLineMsg = function() {
  const {year, month} = state.currentMonth;
  const link = getFillLink();
  const text = `【${year}年${month}月值班填寫通知】\n\n✏️ 填寫不值班日期：\n${link}\n\n👀 查看目前回覆狀況（唯讀）：\n${getViewLink('replies')}\n\n📅 查看目前班表（唯讀）：\n${getViewLink('schedule')}\n\n開啟後請選擇自己的姓名，並輸入您的員工編號。\n\n填寫限制：\n・每月至少保留 10 天可值班\n・假日中至少 1 天可值班\n\n煩請儘早完成填寫，謝謝！`;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copy-msg-btn');
    if (btn) { btn.textContent = '✅ 已複製！'; setTimeout(() => { btn.textContent = '💬 複製含說明的訊息'; }, 2000); }
    showToast('✅ 訊息已複製，可直接貼到 LINE 傳送');
  }).catch(() => {
    const prev = document.getElementById('line-msg-preview');
    if (prev) {
      const escaped = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      const linked = escaped.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" style="color:var(--accent)">$1</a>');
      prev.innerHTML = `<div style="white-space:pre-wrap">${linked}</div>`;
      prev.hidden = false;
    }
    showToast('⚠️ 自動複製失敗，請點擊下方連結或手動複製');
  });
};

async function renderDoctorReply() {
  const el = document.getElementById('page-doctor-reply');
  if (state._fillMonthOverride && !_isSecretary) {
    const {year, month} = state._fillMonthOverride;
    const {data: locked} = await sb.rpc('is_month_locked', {p_month: getMonthKey(year, month)});
    if (locked) { el.innerHTML = lockedPageHTML(year, month); return; }
  }

  // In fill mode (hash link), use the month from the URL, not the secretary's currentMonth
  const {year, month} = state._fillMonthOverride || state.currentMonth;
  const daysInMonth = new Date(year, month, 0).getDate();
  const editingAs = state._editingAs;

  // urlMode: opened via #fill/YYYY/MM link (no editingAs), show name selector
  const urlMode = !!state._fillMonthOverride && !editingAs;

  const existingReply = editingAs ? (getReplies()[editingAs]?.offDays || []) : [];
  const existingPrefer = editingAs ? (getReplies()[editingAs]?.preferDays || []) : [];
  let selectedDays = new Set(existingReply);
  let preferDays = new Set(existingPrefer);
  let selectedName = editingAs || '';
  let verified = !urlMode;     // doctors must enter their PIN first; secretary editing skips it
  let pinError = '';

  // Count holidays for this month using isHoliday()
  function getHolidayDays() {
    const h = [];
    for (let d = 1; d <= daysInMonth; d++) {
      if (isHoliday(year, month, d)) h.push(d);
    }
    return h;
  }

  function calcStats() {
    const offArr = [...selectedDays];
    const availDays = daysInMonth - offArr.length;
    const holidays = getHolidayDays();
    const availHolidays = holidays.filter(d => !offArr.includes(d));
    return {availDays, availHolidays, offArr, holidays};
  }

  function renderPinGate() {
    el.innerHTML = `
      <div class="reply-header">
        <h1>填寫不值班日期</h1>

      ${urlMode ? '' : ''}

        <h1>填寫不值班日期</h1>
        <p>${year}年${month}月 值班意願回覆</p>
      </div>

                `<div style="text-align:center;font-size:11px;font-weight:600;color:var(--fg3);padding:4px 0">${d}</div>`

          </label>

          <div id="prefer-picker" style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">
            ${(() => {
              const headers = ['日','一','二','三','四','五','六'].map(d =>
                `<div style="text-align:center;font-size:11px;font-weight:600;color:var(--fg3);padding:4px 0">${d}</div>`
              ).join('');
              const firstDow = new Date(year, month-1, 1).getDay();
              const blanks = Array.from({length: firstDow}, () => `<div></div>`).join('');
              const days = Array.from({length: daysInMonth}, (_, i) => {
                const d = i + 1;
                const dow = new Date(year, month-1, d).getDay();
                const isHol = isHoliday(year, month, d);
                const isPref = preferDays.has(d);
                const isOff = selectedDays.has(d);
                let style = `width:100%;aspect-ratio:1;padding:0;font-size:13px;border-radius:6px;cursor:pointer;border:1.5px solid;transition:all .15s;`;
                if (isOff) {
                  style += `background:#f3f4f6;color:#ccc;border-color:#e5e7eb;cursor:not-allowed;`;
                } else if (isPref) {
                  style += `background:var(--success);color:#fff;border-color:var(--success);font-weight:600;`;
                } else if (isHol) {
                  style += `background:var(--accent-light);color:var(--accent);border-color:#bfdbfe;`;
                } else {
                  style += `background:var(--surface);color:var(--fg);border-color:var(--border);`;

      selectedDays = new Set(getReplies()[v]?.offDays || []);
      preferDays = new Set(getReplies()[v]?.preferDays || []);
      render();
    };
    window.toggleDay = function(d) {
      if (selectedDays.has(d)) selectedDays.delete(d); else selectedDays.add(d);
      // If a day is marked off, remove it from prefer too
      if (selectedDays.has(d)) preferDays.delete(d);
      render();
    };
    window.togglePrefer = function(d) {
      if (preferDays.has(d)) preferDays.delete(d); else preferDays.add(d);
      render();
    };
    window.clearReplyDays = function() { selectedDays = new Set(); preferDays = new Set(); render(); };
  }

  window.submitReply = async function() {
    const name = selectedName || document.getElementById('reply-name-sel')?.value || editingAs;
    if (!name) { showToast('⚠️ 請先選擇姓名'); return; }
    const {availDays, availHolidays} = calcStats();
    if (availDays < 10 || availHolidays.length < 1) {
      showToast('⚠️ 不符合填寫限制，無法送出'); return;
    }
    try {
      await saveReply(
        name,
        [...selectedDays].sort((a,b) => a-b),
        [...preferDays].sort((a,b) => a-b)
      );
    } catch(e) {
      if (e.code === 'month_locked') { renderDoctorReply(); return; }
      if (e.code && PIN_MSG[e.code]) { showToast(PIN_MSG[e.code]); return; }
      showToast('⚠️ 儲存失敗，請重試');
      console.error('submitReply error', e);
      return;
    }
    state._editingAs = null;
    // Show success in-page
    const el2 = document.getElementById('page-doctor-reply');
    el2.innerHTML = `
      <div class="reply-header" style="background:var(--success)">
        <h1>✅ 填寫完成</h1>
        <p>您的不值班日期已送出，感謝配合！</p>
      </div>
      <div class="reply-body" style="text-align:center;padding-top:40px">
        <div style="font-size:48px;margin-bottom:16px">🎉</div>
        <div style="font-size:16px;font-weight:700;margin-bottom:8px">${name}，已成功送出</div>
        <div style="font-size:13px;color:var(--fg3);margin-bottom:28px">如需修改，請點下方按鈕重新填寫。</div>
        <button class="btn btn-secondary" onclick="window._reEditReply('${name}')"
          style="font-size:14px;padding:12px 28px">
          ✏️ 修改我的填寫
        </button>
      </div>`;

      state._editingAs = n;
      renderDoctorReply();
    };
    if (!urlMode) {
      setTimeout(() => { renderPage('dashboard'); showPage('replies'); }, 1200);
    }
  };

  render();
}

let _traumaPerson = '';
function traumaPickerHTML(ctx) {
  const {year, month} = state.currentMonth;
  const key = `${year}-${month}`;
  const ss = state.secretarySettings;
  const map = ss.traumaPreset?.[key] || {};
  const wardDays = ss.wardPreset?.[key] || [];
  const days = new Date(year, month, 0).getDate();
  if (!TRAUMA_STAFF.includes(_traumaPerson)) _traumaPerson = TRAUMA_STAFF[0];
  const headers = ['日','一','二','三','四','五','六'].map(h =>
    `<div style="text-align:center;font-size:11px;font-weight:600;color:var(--fg3);padding:3px 0">${h}</div>`).join('');
  const blanks = Array.from({length: new Date(year, month - 1, 1).getDay()}, () => '<div></div>').join('');
  const cells = Array.from({length: days}, (_, i) => {
    const d = i + 1, dow = new Date(year, month - 1, d).getDay(), who = map[d];
    const wardBlocked = !who && wardDays.includes(d);
    const hol = isHoliday(year, month, d);
    let bg = hol ? 'var(--surface2)' : 'var(--surface)', color = 'var(--fg)', border = 'var(--border)', extra = '';
    if (who) { bg = 'var(--accent)'; color = '#fff'; border = 'var(--accent)'; }
    if (wardBlocked) { bg = 'var(--warn-light)'; color = 'var(--warn)'; extra = 'opacity:.6;cursor:default;'; }
    return `<button ${wardBlocked ? 'disabled' : `onclick="clickTraumaDay('${ctx}',${d})"`}
      title="${month}/${d}（${DOW[dow]}）${who ? ' → ' + who : ''}${wardBlocked ? ' 已指定為 Ward 班' : ''}"
      style="width:100%;aspect-ratio:1;padding:0;font-size:11px;border-radius:var(--radius-sm);border:1.5px solid ${border};cursor:pointer;background:${bg};color:${color};line-height:1.1;display:flex;flex-direction:column;align-items:center;justify-content:center;${extra}">
      <span>${d}</span>${who ? `<span style="font-size:9px;max-width:100%;overflow:hidden;white-space:nowrap;padding:0 2px">${who}</span>` : ''}
    </button>`;
  }).join('');
  const summary = Object.entries(map).sort((a, b) => +a[0] - +b[0])
    .map(([d, n]) => `<span class="chip chip-blue">${month}/${d}→${n}</span>`).join(' ');
  const counts = TRAUMA_STAFF.map(n => `${n} ${Object.values(map).filter(x => x === n).length}`).join('、');
  return `
    <div style="display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start">
      <div>
        <div style="max-width:360px;margin-bottom:10px"><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">${headers}${blanks}${cells}</div></div>
        <div style="font-size:13px;min-height:30px">${summary || '<span style="color:var(--fg3)">（尚未指定）</span>'}</div>
        ${Object.keys(map).length ? `<div style="font-size:12px;color:var(--fg3);margin-top:6px">共 ${Object.keys(map).length} 天（${counts}）</div>` : ''}
      </div>
      <div style="min-width:140px">
        <div class="form-label" style="margin-bottom:6px">選擇人員</div>
        <select id="trauma-person-${ctx}" onchange="_traumaPerson=this.value"
          style="width:100%;padding:6px 8px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--surface);color:var(--fg);font-size:13px">
          ${TRAUMA_STAFF.map(n => `<option value="${n}" ${n === _traumaPerson ? 'selected' : ''}>${n}</option>`).join('')}
        </select>
        <div style="font-size:11px;color:var(--fg3);margin-top:6px">點選日期即指定上方人員；再點一次同一格取消指定。橘色＝已是 Ward 日。</div>
        <button onclick="clearTraumaDays()" style="margin-top:10px;width:100%;padding:5px 0;border-radius:var(--radius-sm);border:1.5px solid var(--danger);background:transparent;color:var(--danger);cursor:pointer;font-size:12px">清除全部</button>
      </div>
    </div>`;
}
function refreshTraumaPickers() {
  const box = document.getElementById('trauma-picker-dialog');
  if (box) box.innerHTML = traumaPickerHTML('dialog');

}
window.clickTraumaDay = function(ctx, d) {
  const {year, month} = state.currentMonth, key = `${year}-${month}`;
  const sel = document.getElementById('trauma-person-' + ctx);
  if (sel) _traumaPerson = sel.value;
  const ss = state.secretarySettings;
  if (!ss.traumaPreset) ss.traumaPreset = {};
  if (!ss.traumaPreset[key]) ss.traumaPreset[key] = {};
  const map = ss.traumaPreset[key];
  if (map[d]) delete map[d]; else if (TRAUMA_STAFF.includes(_traumaPerson)) map[d] = _traumaPerson;

window.clearTraumaDays = function() {
  const {year, month} = state.currentMonth;
  if (!confirm('確定清除本月所有 Trauma 指定？')) return;
  state.secretarySettings.traumaPreset[`${year}-${month}`] = {};
  saveState(); refreshTraumaPickers();
};

            <span style="font-size:12px;color:var(--fg3)">注意：指定 ER 班時，若該天已為 Trauma/Ward 耦合日，指定會被忽略。</span>
          </div>

          <!-- Tabs for type selection -->
          <div style="display:flex;gap:8px;margin-bottom:14px" id="fixed-assign-tabs">
            ${['er','ward'].map((t,i) => {
              const labels = {er:'🚨 ER',trauma:'🩺 Trauma',ward:'🏥 Ward'};
              return `<button onclick="setFixedTab('${t}')" id="fixed-tab-${t}"

                ${labels[t]}
              </button>`;
            }).join('')}
          </div>

          ${(() => {
            const fixedAll = ss.fixedAssign?.[key] || {};
            const staffByType = {
              er: state.staff.map(s => s.id),
              trauma: TRAUMA_STAFF,

              const fixedMap = fixedAll[type] || {};
              const firstDow = new Date(year, month-1, 1).getDay();

                `<div style="text-align:center;font-size:11px;font-weight:600;color:var(--fg3);padding:3px 0">${h}</div>`
              ).join('');
              const blanks = Array.from({length: firstDow}, () => `<div></div>`).join('');
              const days = Array.from({length: daysInMonth}, (_, i) => {
                const d = i + 1;
                const dow = new Date(year, month-1, d).getDay();
                const assigned = fixedMap[d];

                if (assigned) { bg = 'var(--accent)'; color = '#fff'; border = 'var(--accent)'; }

                    <div style="font-size:13px;min-height:30px">

                    <div style="font-size:11px;color:var(--fg3);margin-top:6px">點選日期即指定右側人員；再點一次同一格取消指定</div>

          })()}

      </div>

      <!-- 本月假日預覽 -->
      <div class="card">
        <div class="card-header"><h2>📋 本月假日一覽</h2></div>
        <div class="card-body">
          <div style="display:flex;flex-wrap:wrap;gap:6px">
            ${Array.from({length: daysInMonth}, (_, i) => {
              const d = i + 1;
              const dow = new Date(year, month-1, d).getDay();
              const hol = isHoliday(year, month, d);
              return hol ? `<span class="chip chip-blue">${month}/${d}(${DOW[dow]})</span>` : '';
            }).join('')}
          </div>
          <div style="font-size:12px;color:var(--fg3);margin-top:10px">
            共 ${Array.from({length:daysInMonth},(_,i)=>i+1).filter(d=>isHoliday(year,month,d)).length} 天假日
          </div>

      </div>

    </div>

  window.toggleWardDay = function(d) {
    if (!state.secretarySettings.wardPreset) state.secretarySettings.wardPreset = {};
    if (!state.secretarySettings.wardPreset[key]) state.secretarySettings.wardPreset[key] = [];
    const arr = state.secretarySettings.wardPreset[key];
    const idx = arr.indexOf(d);
    if (idx >= 0) arr.splice(idx, 1); else arr.push(d);
    saveState();
    renderSecretarySettings();
  };

  window.toggleExtraHoliday = function(d) {
    if (!state.secretarySettings.holidays) state.secretarySettings.holidays = {};
    if (!state.secretarySettings.holidays[key]) state.secretarySettings.holidays[key] = [];
    const arr = state.secretarySettings.holidays[key];
    const idx = arr.indexOf(d);
    if (idx >= 0) arr.splice(idx, 1); else arr.push(d);
    saveState();
    renderSecretarySettings();
  };

  window.toggleExtraWorkday = function(d) {
    if (!state.secretarySettings.extraWorkdays) state.secretarySettings.extraWorkdays = {};
    if (!state.secretarySettings.extraWorkdays[key]) state.secretarySettings.extraWorkdays[key] = [];
    const arr = state.secretarySettings.extraWorkdays[key];
    const idx = arr.indexOf(d);
    if (idx >= 0) arr.splice(idx, 1); else arr.push(d);
    saveState();
    renderSecretarySettings();
  };

  // ── Fixed assign handlers ──
  window.setFixedTab = function(type) {
    ['er','ward'].forEach(t => {
      const tab = document.getElementById('fixed-tab-'+t);
      const panel = document.getElementById('fixed-panel-'+t);
      if (tab) { tab.style.background = t===type ? 'var(--accent)' : 'var(--surface)'; tab.style.color = t===type ? '#fff' : 'var(--fg)'; }
      if (panel) panel.style.display = t===type ? 'block' : 'none';
    });
  };

  window.clickFixedDay = function(type, d) {
    if (!state.secretarySettings.fixedAssign) state.secretarySettings.fixedAssign = {};
    if (!state.secretarySettings.fixedAssign[key]) state.secretarySettings.fixedAssign[key] = {};
    if (!state.secretarySettings.fixedAssign[key][type]) state.secretarySettings.fixedAssign[key][type] = {};
    const map = state.secretarySettings.fixedAssign[key][type];
    if (map[d]) {
      // Toggle off if same day clicked again
      delete map[d];
    } else {
      const sel = document.getElementById('fixed-person-'+type);
      const name = sel ? sel.value : null;
      if (!name) return;
      map[d] = name;
    }
    saveState();
    renderSecretarySettings();
  };

  window.clearFixedType = function(type) {
    if (!state.secretarySettings.fixedAssign?.[key]) return;
    state.secretarySettings.fixedAssign[key][type] = {};
    saveState();
    renderSecretarySettings();
  };
}

window.changePinFlow = function() {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'change-pin-dialog';
  const hasPin = !!getPin();
  overlay.innerHTML = `
    <div class="modal" style="max-width:360px">
      <div class="modal-header"><h3>🔑 ${hasPin ? '修改' : '設定'} PIN 碼</h3></div>
      <div class="modal-body">
        ${hasPin ? `<input id="pin-old" type="password" inputmode="numeric" placeholder="輸入目前 PIN 碼"
          style="width:100%;padding:10px 12px;border:2px solid var(--border);border-radius:var(--radius-sm);font-size:18px;letter-spacing:4px;text-align:center;background:var(--surface);color:var(--fg);margin-bottom:10px">` : ''}
        <input id="pin-new2" type="password" inputmode="numeric" placeholder="新 PIN 碼（4～8位數字）"
          style="width:100%;padding:10px 12px;border:2px solid var(--border);border-radius:var(--radius-sm);font-size:18px;letter-spacing:4px;text-align:center;background:var(--surface);color:var(--fg)">
        <input id="pin-confirm2" type="password" inputmode="numeric" placeholder="確認新 PIN 碼"
          style="width:100%;padding:10px 12px;border:2px solid var(--border);border-radius:var(--radius-sm);font-size:18px;letter-spacing:4px;text-align:center;background:var(--surface);color:var(--fg);margin-top:10px">
        <div id="cpin-err" style="color:var(--danger);font-size:12px;margin-top:8px;min-height:16px"></div>
      </div>
      <div class="modal-footer" style="display:flex;gap:10px">
        <button class="btn btn-secondary" style="flex:1" onclick="document.getElementById('change-pin-dialog').remove()">取消</button>
        <button class="btn btn-primary" style="flex:2" onclick="doChangePin()">儲存</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  (document.getElementById('pin-old') || document.getElementById('pin-new2')).focus();
  window.doChangePin = function() {
    const err = document.getElementById('cpin-err');
    if (hasPin) {
      const old = document.getElementById('pin-old').value;
      if (old !== getPin()) { err.textContent = '目前 PIN 碼錯誤'; return; }
    }
    const nv = document.getElementById('pin-new2').value.trim();
    const cv = document.getElementById('pin-confirm2').value.trim();
    if (!/^\d{4,8}$/.test(nv)) { err.textContent = '請輸入 4～8 位數字'; return; }
    if (nv !== cv) { err.textContent = '兩次輸入不一致'; return; }
    state.secretarySettings.pin = nv;
    saveState();
    document.getElementById('change-pin-dialog').remove();
    showToast('✅ PIN 碼已更新');
    renderSecretarySettings();
  };
};

// ─── Schedule ─────────────────────────────────────────────────────────────────
function getScheduleKey() {
  const {year, month} = state.currentMonth;
  return `${year}-${month}`;
}

function renderSchedule() {
  const el = document.getElementById('page-schedule');
  const {year, month} = state.currentMonth;
  const key = getScheduleKey();
  const sched = state.schedule[key] || {};
  const daysInMonth = new Date(year, month, 0).getDate();

  const hasSched = Object.keys(sched).length > 0;
  document.getElementById('topbar-actions').innerHTML = `
    ${hasSched ? `<button class="btn btn-secondary" onclick="exportScheduleXlsx()">📥 匯出 Excel</button>
    <button class="btn btn-secondary" onclick="exportScheduleToGoogleSheets()">📊 匯出到 Google 試算表</button>` : ''}
    <button class="btn btn-primary" onclick="runAutoSchedule()">🤖 自動排班</button>
  `;

  // Build schedule grid
  const days = [];
  for (let d = 1; d <= daysInMonth; d++) {
    const dow = new Date(year, month-1, d).getDay();
    days.push({d, dow, isWeekend: isHoliday(year, month, d)});
  }

  // Count shifts per person per type
  const erCount = {}, wardCount = {}, traumaCount = {};
  state.staff.forEach(s => { erCount[s.id] = 0; wardCount[s.id] = 0; traumaCount[s.id] = 0; });
  Object.values(sched).forEach(dayShifts => {
    if (dayShifts['ER'] && erCount[dayShifts['ER']] !== undefined) erCount[dayShifts['ER']]++;
    if (dayShifts['Ward'] && wardCount[dayShifts['Ward']] !== undefined) wardCount[dayShifts['Ward']]++;
    if (dayShifts['Trauma'] && traumaCount[dayShifts['Trauma']] !== undefined) traumaCount[dayShifts['Trauma']]++;
  });
  const shiftCount = {};
  state.staff.forEach(s => { shiftCount[s.id] = erCount[s.id] + wardCount[s.id] + traumaCount[s.id]; });
  // Holiday shifts (Sat/Sun/national holidays, minus make-up workdays)
  const erHol = {}, wardHol = {};
  state.staff.forEach(s => { erHol[s.id] = 0; wardHol[s.id] = 0; });
  let holidayTotal = 0;
  for (let d = 1; d <= daysInMonth; d++) {
    if (!isHoliday(year, month, d)) continue;
    holidayTotal++;
    const sh = sched[d] || {};
    if (sh.ER && erHol[sh.ER] !== undefined) erHol[sh.ER]++;
    if (sh.Ward && wardHol[sh.Ward] !== undefined) wardHol[sh.Ward]++;
  }
  const holChip = c => `<div style="font-weight:700;font-size:16px;border-radius:6px;padding:4px 8px;display:inline-block;background:var(--warn-light);color:var(--warn);border:1px solid var(--warn)">${c}</div>`;

  el.innerHTML = `
    <div style="margin-bottom:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <span style="font-size:15px;font-weight:700">${year}年${month}月班表</span>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${SHIFTS.map(s => `<span class="chip ${SHIFT_CLASS[s] ? 'slot '+SHIFT_CLASS[s] : 'chip-gray'}" style="border-radius:4px">${s}</span>`).join('')}
        <span class="chip" style="border-radius:4px;background:var(--warn-light);color:var(--warn);border:1px solid var(--warn)">假日</span>
      </div>
    </div>

    ${(state.scheduleMeta?.[key]?.disabled || []).length ? `<div class="info-box" style="margin-bottom:16px;font-size:13px">本月班表為了排出結果，已放棄規則：${state.scheduleMeta[key].disabled.map(r => `<strong>${r}</strong> ${RULE_NAMES[r]}`).join('；')}</div>` : ''}

    <!-- Shift count -->
    <div class="card" style="margin-bottom:16px">
      <div class="card-header"><h2>班數統計（本月）</h2></div>
      <div class="card-body" style="display:flex;flex-direction:column;gap:14px">
        <div>
          <div style="font-size:12px;font-weight:600;color:var(--fg3);margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em">
            ER 班（10人，共${Object.values(erCount).reduce((a,b)=>a+b,0)}天）
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:10px">
            ${state.staff.map(s => {
              const c = erCount[s.id] || 0;
              const color = c < 3 ? 'var(--warn)' : c > 3 ? 'var(--danger)' : 'var(--success)';
              return `<div style="text-align:center;min-width:48px">
                <div class="slot er" style="font-weight:700;font-size:16px;border-radius:6px;padding:4px 8px;display:inline-block">${c}</div>
                <div style="font-size:11px;color:var(--fg2);margin-top:2px">${s.id}</div>
              </div>`;
            }).join('')}
          </div>
        </div>
        <div>
          <div style="font-size:12px;font-weight:600;color:var(--warn);margin-bottom:8px;letter-spacing:.05em">
            ER 假日班（本月假日 ${holidayTotal} 天，共${Object.values(erHol).reduce((a,b)=>a+b,0)}班）
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:10px">
            ${state.staff.map(s => `<div style="text-align:center;min-width:48px">${holChip(erHol[s.id] || 0)}<div style="font-size:11px;color:var(--fg2);margin-top:2px">${s.id}</div></div>`).join('')}
          </div>
        </div>
        <div>
          <div style="font-size:12px;font-weight:600;color:var(--fg3);margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em">
            Ward 班（7人，共${Object.values(wardCount).reduce((a,b)=>a+b,0)}天）
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:10px">
            ${WARD_STAFF.map(name => {
              const c = wardCount[name] || 0;
              return `<div style="text-align:center;min-width:48px">
                <div class="slot ward" style="font-weight:700;font-size:16px;border-radius:6px;padding:4px 8px;display:inline-block">${c}</div>
                <div style="font-size:11px;color:var(--fg2);margin-top:2px">${name}</div>
              </div>`;
            }).join('')}
          </div>
        </div>
        <div>
          <div style="font-size:12px;font-weight:600;color:var(--warn);margin-bottom:8px;letter-spacing:.05em">
            Ward 假日班（本月假日 ${holidayTotal} 天，共${Object.values(wardHol).reduce((a,b)=>a+b,0)}班）
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:10px">
            ${WARD_STAFF.map(name => `<div style="text-align:center;min-width:48px">${holChip(wardHol[name] || 0)}<div style="font-size:11px;color:var(--fg2);margin-top:2px">${name}</div></div>`).join('')}
          </div>
        </div>
        <div>
          <div style="font-size:12px;font-weight:600;color:var(--fg3);margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em">
            Trauma 班（3人，共${Object.values(traumaCount).reduce((a,b)=>a+b,0)}天）
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:10px">
            ${TRAUMA_STAFF.map(name => {
              const c = traumaCount[name] || 0;
              return `<div style="text-align:center;min-width:48px">
                <div class="slot trauma" style="font-weight:700;font-size:16px;border-radius:6px;padding:4px 8px;display:inline-block">${c}</div>
                <div style="font-size:11px;color:var(--fg2);margin-top:2px">${name}</div>
              </div>`;
            }).join('')}
          </div>
        </div>
      </div>
    </div>

    <!-- Schedule grid -->
    <div class="card">
      <div class="cal-outer">
        <table class="schedule-table">
          <thead>
            <tr>
              <th style="min-width:60px">日期</th>
              <th>星期</th>
              ${SHIFTS.map(s => `<th>${s}</th>`).join('')}
            </tr>
          </thead>
          <tbody>
            ${days.map(({d, dow, isWeekend}) => {
              const dayKey = `${d}`;
              const dayShifts = sched[dayKey] || {};
              const offPeople = new Set(
                state.staff.filter(s => (getReplies()[s.id]?.offDays || []).includes(d)).map(s => s.id)
              );
              const rowBg = isWeekend ? 'background:var(--warn-light)' : '';
              return `<tr style="${rowBg}">
                <td style="font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap">${month}/${d}</td>
                <td style="text-align:center;font-weight:600;color:${isWeekend ? 'var(--warn)' : 'var(--fg2)'}">${DOW[dow]}${isWeekend ? ' <span style="font-size:10px">假日</span>' : ''}</td>
                ${SHIFTS.map(shift => {
                  const assigned = dayShifts[shift] || '';
                  const isOff = assigned && offPeople.has(assigned);
                  return `<td>
                    ${assigned ? `<div class="slot ${SHIFT_CLASS[shift]||''}" onclick="openSlotEdit(${d},'${shift}')" title="點擊更改">
                      <span>${assigned}</span>
                      <button class="remove-btn" onclick="event.stopPropagation();removeSlot(${d},'${shift}')">✕</button>
                    </div>` :
                    `<button class="add-slot-btn" onclick="openSlotEdit(${d},'${shift}')">+</button>`}
                  </td>`;
                }).join('')}
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function removeSlot(day, shift) {
  const key = getScheduleKey();
  if (!state.schedule[key]) return;
  if (state.schedule[key][day]) {
    delete state.schedule[key][day][shift];
  }
  saveState();
  renderSchedule();
}

let _slotEdit = null;

function openSlotEdit(day, shift) {
  const {year, month} = state.currentMonth;
  const key = getScheduleKey();
  const sched = state.schedule[key] || {};
  const current = sched[day]?.[shift] || '';

  // Who's available this day
  const offPeople = new Set(
    state.staff.filter(s => (getReplies()[s.id]?.offDays || []).includes(day)).map(s => s.id)
  );
  // Who's already assigned today
  const assignedToday = new Set(Object.values(sched[day] || {}));

  _slotEdit = {day, shift};
  document.getElementById('slot-modal-title').textContent = `${month}/${day} — ${shift}`;
  document.getElementById('slot-modal-body').innerHTML = `
    <p style="font-size:13px;color:var(--fg2);margin-bottom:12px">選擇值班醫師：</p>
    <div style="display:flex;flex-direction:column;gap:6px">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
        <input type="radio" name="slot-person" value="" ${!current ? 'checked' : ''}> <span style="color:var(--fg3)">（空班）</span>
      </label>
      ${state.staff.map(s => {
        const isOff = offPeople.has(s.id);
        const isAssigned = assignedToday.has(s.id) && s.id !== current;
        return `<label style="display:flex;align-items:center;gap:8px;cursor:pointer;opacity:${isOff ? 0.4 : 1}">
          <input type="radio" name="slot-person" value="${s.id}" ${s.id === current ? 'checked' : ''} ${isOff ? 'disabled' : ''}>
          <span>${s.id}</span>
          ${isOff ? '<span class="chip chip-red" style="font-size:10px">不值</span>' : ''}
          ${isAssigned ? '<span class="chip chip-orange" style="font-size:10px">已排他班</span>' : ''}
        </label>`;
      }).join('')}
    </div>
  `;
  document.getElementById('slot-modal').hidden = false;
}

function confirmSlotEdit() {
  if (!_slotEdit) return;
  const {day, shift} = _slotEdit;
  const key = getScheduleKey();
  const val = document.querySelector('input[name="slot-person"]:checked')?.value || '';
  if (!state.schedule[key]) state.schedule[key] = {};
  if (!state.schedule[key][day]) state.schedule[key][day] = {};
  if (val) state.schedule[key][day][shift] = val;
  else delete state.schedule[key][day][shift];
  saveState();
  closeModal('slot-modal');
  renderSchedule();
}

//   3. ER = Trauma日同一人, Ward日同一人, 其餘日從10人平衡分配
