// ─── Balance helper ───────────────────────────────────────────────────────────
// Moves auto-assigned days from over-loaded people to under-loaded ones (never off days,
// never back-to-back with the receiver's own days) until counts differ by at most 1.
// sched: {day: name}   movable: days that may be reassigned   people: eligible names
// load: {name: count} (updated in place)   daysOf: {name: [days]} (updated in place)
// prefer: {name: Set} only used to choose WHICH day to move (keep the donor's preferred days)
function rebalanceDays(sched, movable, people, offMap, load, daysOf, prefer) {
  for (let guard = 0; guard < 500; guard++) {
    let moved = false;
    const donors = [...people].sort((a, b) => load[b] - load[a]);
    outer:
    for (const donor of donors) {
      const receivers = [...people].sort((a, b) => load[a] - load[b]);
      for (const rec of receivers) {
        if (load[donor] - load[rec] < 2) break;
        const cands = movable.filter(d => sched[d] === donor
          && !(offMap[rec] && offMap[rec].has(d))
          && !daysOf[rec].includes(d - 1) && !daysOf[rec].includes(d + 1));
        if (!cands.length) continue;
        cands.sort((a, b) => {
          const sa = (prefer[donor]?.has(a) ? 2 : 0) - (prefer[rec]?.has(a) ? 1 : 0);
          const sb = (prefer[donor]?.has(b) ? 2 : 0) - (prefer[rec]?.has(b) ? 1 : 0);
          return sa - sb;
        });
        const d = cands[0];
        sched[d] = rec;
        load[donor]--; load[rec]++;
        daysOf[donor] = daysOf[donor].filter(x => x !== d);
        daysOf[rec].push(d);
        moved = true;
        break outer;
      }
    }
    if (!moved) break;
  }
}

// Swap days between people so holiday shifts (Ward or ER) are spread evenly too
// (total Ward counts stay unchanged because each move is a one-for-one swap).
function rebalanceHolidayShifts(sched, movable, people, offMap, daysOf, isHol) {
  const hc = n => daysOf[n].filter(d => isHol(d)).length;
  for (let g = 0; g < 300; g++) {
    let moved = false;
    const donors = [...people].sort((a, b) => hc(b) - hc(a));
    outer:
    for (const donor of donors) {
      for (const rec of [...people].sort((a, b) => hc(a) - hc(b))) {
        if (hc(donor) - hc(rec) < 2) break;
        const hd = movable.filter(d => sched[d] === donor && isHol(d));
        const re = movable.filter(e => sched[e] === rec && !isHol(e));
        for (const d of hd) for (const e of re) {
          if (offMap[rec]?.has(d) || offMap[donor]?.has(e)) continue;
          const dd = daysOf[donor].filter(x => x !== d), rd = daysOf[rec].filter(x => x !== e);
          if (rd.includes(d - 1) || rd.includes(d + 1) || dd.includes(e - 1) || dd.includes(e + 1)) continue;
          sched[d] = rec; sched[e] = donor;
          daysOf[donor] = dd.concat(e); daysOf[rec] = rd.concat(d);
          moved = true; break outer;
        }
      }
    }
    if (!moved) break;
  }
}

// Rule: anyone with 2+ Ward shifts must have only weekday Ward shifts (holiday Ward goes to people with a single Ward shift).
// Swaps a holiday Ward day of a 2+ person with a weekday Ward day of a 1-shift person.
function enforceWeekdayWard(sched, movable, people, offMap, daysOf, isHol) {
  for (let g = 0; g < 300; g++) {
    let moved = false;
    outer:
    for (const donor of people) {
      if (daysOf[donor].length < 2) continue;
      for (const h of daysOf[donor].filter(d => isHol(d) && movable.includes(d))) {
        for (const rec of people) {
          if (rec === donor || daysOf[rec].length > 1) continue;
          for (const e of daysOf[rec].filter(d => !isHol(d) && movable.includes(d))) {
            if (offMap[rec]?.has(h) || offMap[donor]?.has(e)) continue;
            const dd = daysOf[donor].filter(x => x !== h), rd = daysOf[rec].filter(x => x !== e);
            if (rd.includes(h - 1) || rd.includes(h + 1) || dd.includes(e - 1) || dd.includes(e + 1)) continue;
            sched[h] = rec; sched[e] = donor;
            daysOf[donor] = dd.concat(e); daysOf[rec] = rd.concat(h);
            moved = true; break outer;
          }
        }
      }
    }
    if (!moved) break;
  }
}

// ─── Rules (numbers are shown to the secretary in the warning window) ───────
const RULE_NAMES = {
  R1: '預假不排班',
  R2: '人員資格（Trauma 3 人／Ward 7 人／ER 全部 10 人）',
  R3: '每天一位 ER；Trauma／Ward 日的 ER 為同一人；Ward 不與 Trauma 同日',
  R4: '秘書的 Trauma 指定、ER／Ward 固定指派優先',
  R5: '同一人不連續兩天值 Ward',
  R6: '同一人不連續兩天值 ER',
  R7: 'ER 總班數範圍（二月每人 2～3 班，其他月份每人 3～4 班）',
  R8: 'Ward 班數：7 位 Ward 醫師每人 1 或 2 班',
  R9: 'Ward 兩班者，兩班皆為平日（假日 Ward 只給 Ward 僅 1 班者）',
  R10: 'ER 假日班差距不超過 1 班',
  R11: 'ER 假日班有 2 班者，其 ER 總班數為當月較少的一檔（二月 2 班、其他月 3 班）',
  R12: '醫師「期待值班」日期（加分）',
};
// Rules the secretary may choose to give up when a complete schedule is not possible (R2–R5 are never droppable)
const DROPPABLE_RULES = ['R1', 'R6', 'R7', 'R8', 'R9', 'R10', 'R11'];
const RULE_DROP_NOTE = {
  R1: '無人可排的日子，改排給預假的人',
  R6: '允許同一人連續兩天值 ER（只在排不出來時才使用）',
  R7: '不再限制每人 ER 總班數上下限',
  R8: '不再限制 Ward 每人 1～2 班',
  R9: '允許 Ward 兩班者含假日班',
  R10: '不再要求 ER 假日班差距不超過 1',
  R11: '不再要求假日 ER 2 班者落在較少的一檔',
};

// Rule R11: a person with 2 holiday ER shifts should sit on the lower total tier. Hands one weekday free ER day
// to someone with fewer total shifts (and fewer than 2 holiday shifts), keeping everybody within [lowTier, maxTotal].
function lowerTierForHoliday2(sched, movable, people, offMap, load, daysOf, isHol, lowTier, maxTotal) {
  for (let g = 0; g < 200; g++) {
    let moved = false;
    outer:
    for (const P of people) {
      if (daysOf[P].filter(isHol).length < 2 || load[P] <= lowTier) continue;
      for (const Q of [...people].sort((a, b) => load[a] - load[b])) {
        if (Q === P || load[Q] >= load[P] || load[Q] >= maxTotal) continue;
        if (daysOf[Q].filter(isHol).length >= 2) continue;
        const d = movable.find(x => sched[x] === P && !isHol(x) && !offMap[Q]?.has(x)
          && !daysOf[Q].includes(x - 1) && !daysOf[Q].includes(x + 1));
        if (d === undefined) continue;
        sched[d] = Q; load[P]--; load[Q]++;
        daysOf[P] = daysOf[P].filter(x => x !== d); daysOf[Q].push(d);
        moved = true; break outer;
      }
    }
    if (!moved) break;
  }
}

// Checks a finished schedule against the rules (skipping rules the secretary has given up).
function evaluateRules(sched, c) {
  const {year, month, daysInMonth, off, isHol, offOf, fixed, wardExpected, traumaExpected, names, wardStaff} = c;
  const ev = {emptyER: [], emptyWard: [], emptyTrauma: [], violations: []};
  const dl = d => `${month}/${d}(${DOW[new Date(year, month - 1, d).getDay()]})`;
  for (let d = 1; d <= daysInMonth; d++) {
    if (!sched[d]?.ER) ev.emptyER.push(d);
    if (wardExpected.includes(d) && !sched[d]?.Ward) ev.emptyWard.push(d);
    if (traumaExpected.includes(d) && !sched[d]?.Trauma) ev.emptyTrauma.push(d);
  }
  const days = Array.from({length: daysInMonth}, (_, i) => i + 1);
  const cnt = (t, n) => days.filter(d => sched[d]?.[t] === n).length;
  const hcnt = (t, n) => days.filter(d => sched[d]?.[t] === n && isHol(d)).length;
  const add = (id, details) => { if (!off.has(id) && details.length) ev.violations.push({id, title: RULE_NAMES[id], details}); };

  const r1 = [];
  days.forEach(d => ['Trauma', 'Ward', 'ER'].forEach(t => {
    const p = sched[d]?.[t];
    const fixedDay = fixed.has(`${t}:${d}`) || (t === 'ER' && (fixed.has(`ER:${d}`) || fixed.has(`Trauma:${d}`) || fixed.has(`Ward:${d}`)));
    if (p && offOf(p, d) && !fixedDay) r1.push(`${dl(d)} ${t}：${p}（該日預假）`);
  }));
  add('R1', r1);

  const r6 = [];
  for (let d = 1; d < daysInMonth; d++) { const a = sched[d]?.ER; if (a && a === sched[d + 1]?.ER) r6.push(`${dl(d)}～${dl(d + 1)} ${a}`); }
  add('R6', r6);

  const lo = month === 2 ? 2 : 3, hi = month === 2 ? 3 : 4;
  add('R7', names.filter(n => cnt('ER', n) < lo || cnt('ER', n) > hi).map(n => `${n}：ER ${cnt('ER', n)} 班（應為 ${lo}～${hi} 班）`));

  const hasWard = wardExpected.length > 0 || days.some(d => sched[d]?.Ward);
  if (hasWard) add('R8', wardStaff.filter(n => cnt('Ward', n) < 1 || cnt('Ward', n) > 2).map(n => `${n}：Ward ${cnt('Ward', n)} 班（應為 1～2 班）`));
  add('R9', wardStaff.filter(n => cnt('Ward', n) >= 2 && hcnt('Ward', n) > 0).map(n => `${n}：Ward ${cnt('Ward', n)} 班，其中假日 ${hcnt('Ward', n)} 班`));

  const eh = names.map(n => hcnt('ER', n));
  if (Math.max(...eh) - Math.min(...eh) > 1) add('R10', [`各人 ER 假日班：${names.map((n, i) => `${n} ${eh[i]}`).join('、')}`]);
  add('R11', names.filter(n => hcnt('ER', n) >= 2 && cnt('ER', n) > lo).map(n => `${n}：假日 ER ${hcnt('ER', n)} 班，ER 總班數 ${cnt('ER', n)} 班（應為 ${lo} 班）`));
  return ev;
}

function executeAutoSchedule(year, month, daysInMonth, key, opts) {
  // opts (re-run from the warning window): {wardRaw, wardDaysCount, allowConsec}
  const wardRaw   = opts ? opts.wardRaw : document.getElementById('ward-input').value.trim();
  const wardDaysCount = opts ? opts.wardDaysCount : (parseInt(document.getElementById('ward-days-count').value) || 12);
  const allowConsec = opts ? opts.allowConsec : Math.max(0, parseInt(document.getElementById('consec-count')?.value) || 0);
  const autoInputs = {wardRaw, wardDaysCount};
  const off = new Set(opts?.disabled || []);   // rules the secretary has chosen to give up
  let consecLeft = off.has('R6') ? Infinity : allowConsec;   // back-to-back ER shifts we may still hand out (R6)
  const errEl = document.getElementById('schedule-error') || {style: {}};
  errEl.style.display = 'none';

  // Trauma comes from the picker (秘書設定 → Trauma 班指定)
  const traumaSched = {}; // {day: name}
  Object.entries(state.secretarySettings?.traumaPreset?.[key] || {}).forEach(([d, n]) => {
    if (TRAUMA_STAFF.includes(n)) traumaSched[+d] = n;
  });

  // Parse ward (optional) — format: just day numbers (name auto-assigned) or day:name
  // wardDaysList: days to assign ward (name=null means auto-assign)
  const wardDaysList = []; // [{day, name}] name may be null
  if (wardRaw) {
    for (const line of wardRaw.split('\n')) {
      const t = line.trim();
      if (!t) continue;
      if (t.includes(':')) {
        // Legacy format day:name
        const [d, n] = t.split(':');
        const day = parseInt(d);
        const name = n?.trim();
        if (!day || !name || !WARD_STAFF.includes(name)) {
          errEl.textContent = `Ward 格式錯誤或人員不符：「${t}」`;
          errEl.style.display = ''; return;
        }
        if (traumaSched[day]) {
          errEl.textContent = `第 ${day} 天已有 Trauma 班，不能同天安排 Ward`;
          errEl.style.display = ''; return;
        }
        wardDaysList.push({day, name});
      } else {
        // New format: just day number, name auto-assigned
        const day = parseInt(t);
        if (!day || day < 1 || day > daysInMonth) {
          errEl.textContent = `Ward 日期格式錯誤：「${t}」`;
          errEl.style.display = ''; return;
        }
        if (traumaSched[day]) {
          errEl.textContent = `第 ${day} 天已有 Trauma 班，不能同天安排 Ward`;
          errEl.style.display = ''; return;
        }
        wardDaysList.push({day, name: null});
      }
    }
  }
  // Merge fixedAssign.ward into wardDaysList before building wardSchedInput
  const fixedWard = (state.secretarySettings?.fixedAssign?.[key]?.ward) || {};
  Object.entries(fixedWard).forEach(([ds, name]) => {
    const d = parseInt(ds);
    if (!traumaSched[d] && !wardDaysList.find(x=>x.day===d)) {
      if (WARD_STAFF.includes(name)) wardDaysList.push({day: d, name});
    }
  });

  // Build wardSchedInput from pre-specified names; days with name=null are added later
  const wardSchedInput = {};
  wardDaysList.filter(x=>x.name).forEach(x => { wardSchedInput[x.day] = x.name; });
  // Days that need auto-assignment
  const wardAutoAssignDays = wardDaysList.filter(x=>!x.name).map(x=>x.day);

  // Merge fixedAssign.trauma into traumaSched (secretary fixed trauma assignments)
  const fixedTrauma = (state.secretarySettings?.fixedAssign?.[key]?.trauma) || {};
  Object.entries(fixedTrauma).forEach(([ds, name]) => {
    const d = parseInt(ds);
    if (!traumaSched[d] && TRAUMA_STAFF.includes(name)) traumaSched[d] = name;
  });

  // ── Step 1: Trauma days fixed ──
  const traumaDays = Object.keys(traumaSched).map(Number).sort((a,b)=>a-b);

  // ── Step 2: Ward days ──
  // "weekend" here means any holiday (Sat/Sun/national holiday, minus make-up workdays)
  const isWeekend = d => isHoliday(year, month, d);
  let wardSched = {...wardSchedInput};

  // wardAutoAssignDays: days from secretary preset without assigned names → need auto-assign
  // specifiedWardDays: days already in wardSched (name provided)
  const specifiedWardDays = Object.keys(wardSched).map(Number);
  // If wardAutoAssignDays has days, those also count toward the total
  const totalPresetDays = specifiedWardDays.length + wardAutoAssignDays.length;
  const effectiveWardCount = totalPresetDays > 0 ? totalPresetDays : wardDaysCount;
  const remainWardCount = effectiveWardCount - specifiedWardDays.length;

  const autoWardDays = [];
  const isHol = d => isHoliday(year, month, d);
  if (remainWardCount > 0) {
    // Off-day sets and prefer-day sets per person
    const offMap = {};
    const preferMapW = {};
    state.staff.forEach(s => {
      offMap[s.id] = new Set(getReplies()[s.id]?.offDays || []);
      preferMapW[s.id] = off.has('R12') ? new Set() : new Set(getReplies()[s.id]?.preferDays || []);
    });

    // Count ward shifts per person so far
    const wardCount = {};
    WARD_STAFF.forEach(n => { wardCount[n] = 0; });
    specifiedWardDays.forEach(d => { if (wardSched[d]) wardCount[wardSched[d]]++; });

    // Build candidate days:
    // If wardAutoAssignDays has specific days (from secretary preset), use those;
    // otherwise pick from all days not trauma/ward-assigned
    let candidateDays = [];
    if (wardAutoAssignDays.length > 0) {
      candidateDays = wardAutoAssignDays.filter(d => !traumaSched[d] && !wardSched[d]).sort((a,b)=>a-b);
    } else {
      for (let d = 1; d <= daysInMonth; d++) {
        if (traumaSched[d]) continue;
        if (wardSched[d]) continue;
        candidateDays.push(d);
      }
    }

    // Greedily assign ward days, picking person with fewest wards
    for (let i = 0; i < Math.min(remainWardCount, candidateDays.length); i++) {
      const d = candidateDays[i];
      // Find available ward staff (not off, not consecutive with own assignments)
      const assignedDaysOfPerson = {};
      WARD_STAFF.forEach(n => { assignedDaysOfPerson[n] = []; });
      Object.entries(wardSched).forEach(([day, name]) => { assignedDaysOfPerson[name]?.push(parseInt(day)); });

      const available = WARD_STAFF.filter(n => {
        if (offMap[n].has(d)) return false;                           // R1
        if (!off.has('R8') && wardCount[n] >= 2) return false;        // R8: at most 2 Ward shifts each
        // Consecutive check per person (R5, always enforced)
        const myDays = assignedDaysOfPerson[n];
        if (myDays.includes(d-1) || myDays.includes(d+1)) return false;
        return true;
      }).sort((a,b) => {
        // Balance first (fewest ward shifts), preferred day is only a tie-breaker
        if (wardCount[a] !== wardCount[b]) return wardCount[a] - wardCount[b];
        if (isHol(d)) {                       // holiday Ward shift: favour whoever has fewer holiday Ward shifts
          const ah = assignedDaysOfPerson[a].filter(isHol).length, bh = assignedDaysOfPerson[b].filter(isHol).length;
          if (ah !== bh) return ah - bh;
        }
        const aPref = (preferMapW[a]?.has(d)) ? -1 : 0;
        const bPref = (preferMapW[b]?.has(d)) ? -1 : 0;
        return aPref - bPref;
      });

      if (available.length === 0 && off.has('R1')) {      // R1 given up: nobody free → use someone who is off that day (never back-to-back: R5)
        const fb = WARD_STAFF.filter(n => !assignedDaysOfPerson[n].includes(d - 1) && !assignedDaysOfPerson[n].includes(d + 1))
          .sort((a, b) => wardCount[a] - wardCount[b]);
        if (fb.length) available.push(fb[0]);
      }
      if (available.length > 0) {
        wardSched[d] = available[0];
        wardCount[available[0]]++;
        assignedDaysOfPerson[available[0]].push(d);
        autoWardDays.push(d);
      }
    }

    // Second pass: even out ward shifts among the 7 ward staff
    const wDays = {};
    WARD_STAFF.forEach(n => { wDays[n] = []; });
    Object.entries(wardSched).forEach(([day, name]) => { wDays[name]?.push(parseInt(day)); });
    rebalanceDays(wardSched, autoWardDays, WARD_STAFF, offMap, wardCount, wDays, preferMapW);
    if (!off.has('R9')) enforceWeekdayWard(wardSched, autoWardDays, WARD_STAFF, offMap, wDays, isHol);
  }

  const wardDays = Object.keys(wardSched).map(Number).sort((a,b)=>a-b);

  // ── Step 3: ER assignment ──
  // Coupled days (Trauma / Ward carry their person into ER)
  const erSched = {};
  traumaDays.forEach(d => { erSched[d] = traumaSched[d]; });
  wardDays.forEach(d => { erSched[d] = wardSched[d]; });

  // Apply secretary fixed assignments (override free days, skip already-coupled)
  const fixedER = (state.secretarySettings?.fixedAssign?.[key]?.er) || {};
  Object.entries(fixedER).forEach(([ds, name]) => {
    const d = parseInt(ds);
    if (!erSched[d]) {  // only assign if not already taken by trauma/ward coupling
      const person = state.staff.find(s => s.id === name);
      if (person) erSched[d] = name;
    }
  });

  // Free ER days (no trauma, no ward, no fixed)
  const freeDays = [];
  for (let d = 1; d <= daysInMonth; d++) {
    if (!erSched[d]) freeDays.push(d);
  }

  // Balance free ER across all 10 staff
  const erCount = {}; // total ER per person
  const erWkndCount = {};
  state.staff.forEach(s => { erCount[s.id] = 0; erWkndCount[s.id] = 0; });
  // Count coupled + fixed ER (they all count toward the person's total)
  Object.entries(erSched).forEach(([d, n]) => {
    if (erCount[n] !== undefined) {
      erCount[n]++;
      if (isWeekend(parseInt(d))) erWkndCount[n]++;
    }
  });

  // Track each person's ER days for consecutive check
  const erDaysOfPerson = {};
  state.staff.forEach(s => { erDaysOfPerson[s.id] = []; });
  Object.entries(erSched).forEach(([d, n]) => { erDaysOfPerson[n].push(parseInt(d)); });

  const offMap2 = {};
  const preferMap = {}; // preferDays per person
  state.staff.forEach(s => {
    offMap2[s.id] = new Set(getReplies()[s.id]?.offDays || []);
    preferMap[s.id] = off.has('R12') ? new Set() : new Set(getReplies()[s.id]?.preferDays || []);
  });

  const maxER = month === 2 ? 3 : 4;                              // R7 upper bound
  const capOK = n => off.has('R7') || erCount[n] < maxER;
  for (const d of freeDays) {
    const wknd = isWeekend(d);
    const available = state.staff.filter(s => {
      if (offMap2[s.id].has(d)) return false;                    // R1
      if (!capOK(s.id)) return false;                            // R7
      const myDays = erDaysOfPerson[s.id];
      if (myDays.includes(d-1) || myDays.includes(d+1)) return false;
      return true;
    }).sort((a, b) => {
      // Balance first: fewest total ER shifts; preferred day / weekend count only break ties
      if (erCount[a.id] !== erCount[b.id]) return erCount[a.id] - erCount[b.id];
      const aPref = preferMap[a.id].has(d) ? -1 : 0;
      const bPref = preferMap[b.id].has(d) ? -1 : 0;
      if (aPref !== bPref) return aPref - bPref;
      if (wknd) return erWkndCount[a.id] - erWkndCount[b.id];
      return 0;
    });

    if (available.length > 0) {
      const chosen = available[0];
      erSched[d] = chosen.id;
      erCount[chosen.id]++;
      if (wknd) erWkndCount[chosen.id]++;
      erDaysOfPerson[chosen.id].push(d);
    }
  }

  // Repair empty days: free a person who is blocked only by a neighbouring *free* ER day,
  // by handing that neighbouring day to someone else. Works without any back-to-back shift.
  const allIds = state.staff.map(s => s.id);
  const freeSet = new Set(freeDays);
  const canTake = (n, day) => !offMap2[n].has(day) && capOK(n) && !erDaysOfPerson[n].some(x => x === day - 1 || x === day + 1);
  const moveER = (day, from, to) => {
    erSched[day] = to; erCount[to]++; erDaysOfPerson[to].push(day); if (isWeekend(day)) erWkndCount[to]++;
    if (from) { erCount[from]--; erDaysOfPerson[from] = erDaysOfPerson[from].filter(x => x !== day); if (isWeekend(day)) erWkndCount[from]--; }
  };
  for (const d of freeDays) {
    if (erSched[d]) continue;
    for (const P of allIds) {
      if (offMap2[P].has(d)) continue;
      const adj = [d - 1, d + 1].filter(a => erDaysOfPerson[P].includes(a));
      if (!adj.length || !adj.every(a => freeSet.has(a))) continue;      // blocked by a fixed day: cannot repair
      const plan = adj.map(a => ({a, Q: allIds.filter(n => n !== P && canTake(n, a)).sort((x, y) => erCount[x] - erCount[y])[0]}));
      if (plan.some(x => !x.Q)) continue;
      plan.forEach(x => moveER(x.a, P, x.Q));
      moveER(d, null, P);
      break;
    }
  }
  // Still empty and the secretary allowed back-to-back shifts: use them, fewest ER shifts first.
  for (const d of freeDays) {
    if (erSched[d] || consecLeft <= 0) continue;
    const fb = allIds.filter(n => !offMap2[n].has(d) && capOK(n)).sort((a, b) => erCount[a] - erCount[b])[0];
    if (fb) { moveER(d, null, fb); consecLeft--; }
  }
  // R1 given up: days nobody could take → assign someone who is off that day (prefer not back-to-back, fewest shifts)
  if (off.has('R1')) {
    for (const d of freeDays) {
      if (erSched[d]) continue;
      const adjacent = n => (erDaysOfPerson[n].includes(d - 1) || erDaysOfPerson[n].includes(d + 1)) ? 1 : 0;
      const fb = [...allIds].sort((a, b) => adjacent(a) - adjacent(b) || erCount[a] - erCount[b])[0];
      if (fb) moveER(d, null, fb);
    }
  }

  // Second pass: even out total ER shifts (coupled Trauma/Ward days stay fixed)
  rebalanceDays(erSched, freeDays, state.staff.map(s => s.id), offMap2, erCount, erDaysOfPerson, preferMap);
  // Third pass (R10): spread holiday ER shifts (coupled Trauma/Ward days stay fixed)
  if (!off.has('R10')) rebalanceHolidayShifts(erSched, freeDays, state.staff.map(s => s.id), offMap2, erDaysOfPerson, isHol);
  // Fourth pass (R11): people with 2 holiday ER shifts sit on the lower total tier
  if (!off.has('R11')) lowerTierForHoliday2(erSched, freeDays, state.staff.map(s => s.id), offMap2, erCount, erDaysOfPerson, isHol,
                                            month === 2 ? 2 : 3, maxER);

  // ── Build final schedule object ──
  const sched = {};
  for (let d = 1; d <= daysInMonth; d++) {
    sched[d] = {};
    if (traumaSched[d]) sched[d]['Trauma'] = traumaSched[d];
    if (wardSched[d])   sched[d]['Ward']   = wardSched[d];
    if (erSched[d])     sched[d]['ER']     = erSched[d];
  }

  // ── Check the result against the rules ──
  const fixedSet = new Set();
  Object.keys(traumaSched).forEach(d => fixedSet.add(`Trauma:${d}`));
  Object.keys(wardSchedInput).forEach(d => fixedSet.add(`Ward:${d}`));
  Object.keys(fixedER).forEach(d => fixedSet.add(`ER:${d}`));
  const ev = evaluateRules(sched, {
    year, month, daysInMonth, off, isHol, fixed: fixedSet, names: allIds, wardStaff: WARD_STAFF,
    offOf: (n, d) => offMap2[n]?.has(d),
    wardExpected: state.secretarySettings?.wardPreset?.[key] || [],
    traumaExpected: Object.keys(state.secretarySettings?.traumaPreset?.[key] || {}).map(Number),
  });
  if (opts?.dryRun) return ev;                       // used to preview "what if this rule were given up"

  state.schedule[key] = sched;
  state.autoScheduled = true;
  state.scheduleMeta = state.scheduleMeta || {};
  state.scheduleMeta[key] = {disabled: [...off]};
  saveState();
  const lockKey = getMonthKey();   // locking happens below: right away if all is fine, otherwise only when the secretary chooses 「繼續執行排班」

  document.getElementById('auto-dialog')?.remove();
  showPage('schedule');

  const {emptyER, emptyWard, emptyTrauma, violations} = ev;
  const problems = emptyER.length || emptyWard.length || emptyTrauma.length || violations.length;
  if (!problems) {
    const gaveUp = off.size ? `（已放棄 ${[...off].join('、')}）` : '';
    lockMonth(lockKey).then(() => showToast(`✅ 排班完成並已鎖定醫師填寫，所有規則均已滿足${gaveUp}`));
    return;
  }

  // ── Off-day suggestions (who could release which day) ──
  const allNames = allIds;
  const erOf = n => Object.values(sched).filter(x => x.ER === n).length;
  const wdOf = n => Object.values(sched).filter(x => x.Ward === n).length;
  const dayLabel = d => `${month}/${d}(${DOW[new Date(year, month - 1, d).getDay()]})`;
  const wardDaysOf = n => Object.entries(sched).filter(([, v]) => v.Ward === n).map(([k]) => +k);
  const suggestions = [];
  emptyER.forEach(d => {
    const c = allNames.filter(n => offMap2[n].has(d) && !erDaysOfPerson[n].includes(d - 1) && !erDaysOfPerson[n].includes(d + 1))
      .sort((a, b) => erOf(a) - erOf(b)).slice(0, 3);
    suggestions.push(c.length
      ? `${dayLabel(d)} ER 空班：可請 ${c.map(n => `${n}（目前 ER ${erOf(n)} 班）`).join('、')} 釋出該日預假`
      : `${dayLabel(d)} ER 空班：沒有人只因預假而無法值班，需手動指派或放棄規則`);
  });
  emptyWard.forEach(d => {
    const c = WARD_STAFF.filter(n => (getReplies()[n]?.offDays || []).includes(d) && !wardDaysOf(n).includes(d - 1) && !wardDaysOf(n).includes(d + 1))
      .sort((a, b) => wdOf(a) - wdOf(b)).slice(0, 3);
    suggestions.push(c.length
      ? `${dayLabel(d)} Ward 空班：可請 ${c.map(n => `${n}（目前 Ward ${wdOf(n)} 班）`).join('、')} 釋出該日預假`
      : `${dayLabel(d)} Ward 空班：沒有人只因預假而無法值班，需手動指派或放棄規則`);
  });

  // ── Which rule could be given up? Re-run with each candidate dropped and compare. ──
  const score = e => [e.emptyER.length + e.emptyWard.length + e.emptyTrauma.length, e.violations.length];
  const [baseEmpty, baseViol] = score(ev);
  const dropOptions = [];
  DROPPABLE_RULES.filter(r => !off.has(r)).forEach(r => {
    const e2 = executeAutoSchedule(year, month, daysInMonth, key, {...autoInputs, allowConsec, disabled: [...off, r], dryRun: true});
    if (!e2) return;
    const [ee, vv] = score(e2);
    dropOptions.push({id: r, ee, vv, better: ee < baseEmpty || (ee === baseEmpty && vv < baseViol)});
  });
  dropOptions.sort((a, b) => a.ee - b.ee || a.vv - b.vv);
  const shown = dropOptions.filter(o => o.better);

  const emptyAllOff = emptyER.filter(d => allNames.every(n => offMap2[n].has(d)));
  const emptyAdj = emptyER.filter(d => !emptyAllOff.includes(d));
  const lines = [];
  if (emptyAllOff.length) lines.push(`ER 空班（${emptyAllOff.length} 天，<u>全部醫師都預假</u>）：${emptyAllOff.join('、')} 日`);
  if (emptyAdj.length)    lines.push(`ER 空班（${emptyAdj.length} 天，<u>其餘醫師因規則限制排不進</u>）：${emptyAdj.join('、')} 日`);
  if (emptyWard.length)   lines.push(`Ward 空班（${emptyWard.length} 天）：${emptyWard.join('、')} 日`);
  if (emptyTrauma.length) lines.push(`Trauma 空班（${emptyTrauma.length} 天）：${emptyTrauma.join('、')} 日`);

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal" style="max-width:560px;width:94vw">
      <div class="modal-header" style="background:var(--danger);color:#fff"><h3>⚠️ 排班完成，但有規則未能滿足</h3></div>
      <div class="modal-body" style="max-height:70vh;overflow:auto">
        ${off.size ? `<div class="info-box" style="margin-bottom:12px;font-size:13px">已放棄的規則：${[...off].map(r => `<strong>${r}</strong> ${RULE_NAMES[r]}`).join('；')}</div>` : ''}
        ${lines.length ? `<div style="margin-bottom:6px;font-size:14px;font-weight:700">無法排出的日子</div>
          ${lines.map(l => `<div style="background:var(--surface2);border-left:4px solid var(--danger);padding:8px 12px;border-radius:4px;margin-bottom:6px;font-size:13px">${l}</div>`).join('')}` : ''}
        ${violations.length ? `<div style="margin:12px 0 6px;font-size:14px;font-weight:700">未滿足的規則</div>
          ${violations.map(v => `<div style="background:var(--warn-light);border-left:4px solid var(--warn);padding:8px 12px;border-radius:4px;margin-bottom:6px">
            <div style="font-size:13px;font-weight:700">${v.id}　${v.title}</div>
            ${v.details.slice(0, 6).map(t => `<div style="font-size:12px;color:var(--fg2)">• ${t}</div>`).join('')}
            ${v.details.length > 6 ? `<div style="font-size:12px;color:var(--fg3)">…另有 ${v.details.length - 6} 項</div>` : ''}</div>`).join('')}` : ''}
        ${suggestions.length ? `<div style="background:var(--accent-light);border-left:4px solid var(--accent);padding:10px 14px;border-radius:4px;margin-top:12px">
          <div style="font-size:14px;font-weight:700;margin-bottom:6px">💡 請醫師調整的方案</div>
          ${suggestions.map(t => `<div style="font-size:13px;margin-bottom:5px">• ${t}</div>`).join('')}</div>` : ''}
        <div style="margin:14px 0 6px;font-size:14px;font-weight:700">🔧 或由你選擇放棄一條規則後重新排班</div>
        ${shown.length ? shown.map(o => `
          <div style="display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:6px;padding:8px 12px;margin-bottom:6px">
            <div style="flex:1;font-size:13px">
              <div style="font-weight:700">放棄 ${o.id}　${RULE_NAMES[o.id]}</div>
              <div style="font-size:12px;color:var(--fg2)">${RULE_DROP_NOTE[o.id]}</div>
              <div style="font-size:12px;margin-top:2px">結果：${o.ee === 0 ? '<span style="color:var(--success);font-weight:700">✓ 無空班</span>' : `空班 ${o.ee} 天`}，其餘未滿足規則 ${o.vv} 項</div>
            </div>
            <button class="btn btn-sm btn-primary drop-btn" data-rule="${o.id}">放棄並重排</button>
          </div>`).join('')
          : '<div style="font-size:13px;color:var(--fg3)">目前沒有任何單一規則放棄後能改善結果。可先請醫師調整預假，或手動調整班表。</div>'}
      </div>
      <div class="modal-footer" style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-secondary" id="warn-view" style="flex:1;min-width:150px;justify-content:center">知道了，前往班表查看</button>
        <button class="btn btn-primary" id="warn-continue" style="flex:1;min-width:150px;justify-content:center">繼續執行排班</button>
      </div>
      <div style="padding:0 16px 14px;font-size:12px;color:var(--fg3)">
        「前往班表查看」：先保留這份班表，<strong>尚未鎖定</strong>，醫師仍可修改回覆。<br>
        「繼續執行排班」：接受目前結果並<strong>鎖定</strong>本月醫師填寫。
      </div>
    </div>`;
  document.body.appendChild(overlay);

// ─── Export schedule (Excel / Google Sheets) ─────────────────────────────────
function buildScheduleTables() {
  const {year, month} = state.currentMonth;
  const sched = state.schedule[getScheduleKey()] || {};
  const days = new Date(year, month, 0).getDate();
  const rows = [['日期', '星期', '假日', 'Trauma', 'Ward', 'ER']];
  for (let d = 1; d <= days; d++) {
    const sh = sched[d] || {};
    rows.push([`${month}/${d}`, DOW[new Date(year, month - 1, d).getDay()], isHoliday(year, month, d) ? '假日' : '',
               sh.Trauma || '', sh.Ward || '', sh.ER || '']);
  }
  const stats = [['姓名', 'ER', 'Ward', 'Trauma', 'ER 假日班', 'Ward 假日班']];
  state.staff.forEach(s => {
    let er = 0, wd = 0, tr = 0, erH = 0, wdH = 0;
    for (let d = 1; d <= days; d++) {
      const sh = sched[d] || {}, h = isHoliday(year, month, d);
      if (sh.ER === s.id) { er++; if (h) erH++; }
      if (sh.Ward === s.id) { wd++; if (h) wdH++; }
      if (sh.Trauma === s.id) tr++;
    }
    stats.push([s.id, er, wd, tr, erH, wdH]);
  });
  return {rows, stats, year, month};
}

window.exportScheduleXlsx = function() {
  const {rows, stats, year, month} = buildScheduleTables();
  const name = `骨科值班表_${year}-${String(month).padStart(2, '0')}`;
  if (window.XLSX) {
    const wb = XLSX.utils.book_new();
    const ws1 = XLSX.utils.aoa_to_sheet(rows); ws1['!cols'] = [{wch: 8}, {wch: 6}, {wch: 6}, {wch: 10}, {wch: 10}, {wch: 10}];
    const ws2 = XLSX.utils.aoa_to_sheet(stats); ws2['!cols'] = [{wch: 10}, {wch: 8}, {wch: 8}, {wch: 8}, {wch: 12}, {wch: 12}];
    XLSX.utils.book_append_sheet(wb, ws1, `${month}月班表`);
    XLSX.utils.book_append_sheet(wb, ws2, '班數統計');
    XLSX.writeFile(wb, name + '.xlsx');
    showToast('📥 已匯出 Excel');
  } else {                                   // library failed to load: fall back to CSV (UTF-8 BOM so Excel reads Chinese)
    const csv = '﻿' + rows.map(r => r.join(',')).join('\n') + '\n\n' + stats.map(r => r.join(',')).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv;charset=utf-8'}));
    a.download = name + '.csv'; a.click();
    showToast('📥 已匯出 CSV（Excel 可直接開啟）');
  }
};

// A static site cannot write into someone's Google Drive without a Google sign-in setup,
// so: copy the table as tab-separated text and open a new Google Sheet to paste into.
window.exportScheduleToGoogleSheets = async function() {
  const {rows, stats} = buildScheduleTables();
  const tsv = rows.map(r => r.join('\t')).join('\n') + '\n\n' + stats.map(r => r.join('\t')).join('\n');
  try { await navigator.clipboard.writeText(tsv); }
  catch (e) { showToast('⚠️ 無法自動複製，請改用「匯出 Excel」再上傳到 Google 試算表'); return; }
  window.open('https://sheets.new', '_blank');

};

      body = `
        <div class="table-wrap"><table>
          <thead><tr><th>日期</th><th>星期</th><th>Trauma</th><th>Ward</th><th>ER</th></tr></thead>
          <tbody>${Array.from({length: days}, (_, i) => {
            const dd = i + 1, sh = sched[dd] || {}, h = isHoliday(year, month, dd);
            return `<tr style="${h ? 'background:var(--warn-light)' : ''}"><td>${month}/${dd}</td><td>${DOW[new Date(year, month - 1, dd).getDay()]}${h ? ' <span style="font-size:11px;color:var(--warn)">假日</span>' : ''}</td>
              <td ${mine(sh.Trauma)}>${sh.Trauma || ''}</td><td ${mine(sh.Ward)}>${sh.Ward || ''}</td><td ${mine(sh.ER)}>${sh.ER || ''}</td></tr>`; }).join('')}</tbody></table></div>
        <div style="font-weight:700;margin:16px 0 6px">班數統計</div>
        <div class="table-wrap"><table>
          <thead><tr><th>姓名</th><th>ER</th><th>ER 假日</th><th>Ward</th><th>Ward 假日</th><th>Trauma</th></tr></thead>
          <tbody>${state.staff.map(s => `<tr${s.id === v.name ? ' style="background:var(--accent-light)"' : ''}><td>${s.id}</td><td>${cnt[s.id].ER}</td><td style="color:var(--warn);font-weight:600">${cnt[s.id].ERh}</td><td>${cnt[s.id].Ward}</td><td style="color:var(--warn);font-weight:600">${cnt[s.id].Wardh}</td><td>${cnt[s.id].Trauma}</td></tr>`).join('')}</tbody></table></div>`;
    }
  }
  el.innerHTML = `
    <div class="reply-header"><h1>${year}年${month}月 值班資訊</h1><p>${v.name}，您好（唯讀，無法編輯）</p></div>
    <div class="reply-body" style="max-width:none">
      <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">
        ${tabBtn('schedule', '📅 班表')}${tabBtn('replies', '👀 回覆狀況')}
        <button class="btn btn-sm btn-secondary" style="margin-left:auto" onclick="loadView(viewState.pin)">🔄 重新整理</button>
      </div>
      ${body}
      <p style="font-size:11px;color:var(--fg3);text-align:center;margin-top:14px">如需修改請聯絡秘書。</p>
    </div>`;
}

// ─── Init ─────────────────────────────────────────────────────────────────────

// Hash mode: #fill/YYYY/MM → hide sidebar, show only doctor-reply page
// NOTE: do NOT overwrite state.currentMonth or saveState() here —
// the fill link opens in the doctor's browser; we must not corrupt the secretary's localStorage.
function enterFillMode(year, month) {
  // Use a session-only override so getReplies() reads the correct month
  // without touching the persisted currentMonth.
  state._fillMonthOverride = {year, month};
  dbReplies = {};
  subscribeReplies(getMonthKey(year, month));
  const sidebar = document.querySelector('.sidebar');
  const topbar = document.querySelector('.topbar');
  const appLayout = document.querySelector('.app-layout');
  if (sidebar) sidebar.style.display = 'none';
  if (topbar) topbar.style.display = 'none';
  if (appLayout) {
    appLayout.style.gridTemplateColumns = '1fr';
    appLayout.style.maxWidth = '640px';
    appLayout.style.margin = '0 auto';
  }
  showPage('doctor-reply');
}

(async function boot() {
  window.addEventListener('hashchange', function() {
    const m = (location.hash||'').match(/#fill-(\d{4})-(\d{2})/);
    if (m) enterFillMode(parseInt(m[1]), parseInt(m[2]));
  });
  const qp = new URLSearchParams(location.search);
  if (qp.get('view')) {                          // doctors' read-only page
    const vy = parseInt(qp.get('year')), vm = parseInt(qp.get('month'));
    if (vy && vm >= 1 && vm <= 12) { await enterViewMode(vy, vm, qp.get('view')); return; }
  }
  const hm = (location.hash||'').match(/#fill-(\d{4})-(\d{2})/);
  const fill = hm ? {year: parseInt(hm[1]), month: parseInt(hm[2])} : getMonthFromURL();
  if (fill) {                                   // doctor: no login, name list from server
    const {data} = await sb.rpc('list_doctors');
    if (data && data.length) state.staff = data.map(d => ({id: d.name, email: '', color: '#6b7280'}));
    await applyMonthHolidays(fill.year, fill.month);
    enterFillMode(fill.year, fill.month);
    return;
  }
  const {data: {session}} = await sb.auth.getSession();   // secretary
  if (!session) { showAuthGate(); return; }
  _isSecretary = true;
  await loadRemoteState();
  const nav = document.querySelector('.nav');
  if (nav) nav.insertAdjacentHTML('beforeend', '<div class="nav-section-label" style="margin-top:12px">帳號</div><button class="nav-item" onclick="doSignOut()"><span class="icon">🚪</span> 登出</button>');
  const sm = document.getElementById('sidebar-month');
  if (sm) sm.insertAdjacentHTML('beforeend', `<div style="font-size:10px;color:var(--sidebar-fg2);margin-top:8px">版本 ${APP_VERSION}</div>`);
  subscribeReplies(getMonthKey());
  showPage('dashboard');
})();
</script>
