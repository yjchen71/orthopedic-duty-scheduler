# Keeps the free-tier Supabase project from being paused for inactivity
# by sending one lightweight query per day. If the project is already
# unreachable/paused the job fails, and GitHub emails the repo owner.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 3 * * *'      # every day 03:17 UTC
  workflow_dispatch:           # also runnable by hand (Actions tab -> Run workflow)

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: https://rgprcvivaaucyvgqbsgp.supabase.co
          # Publishable key: public by design (same value as in config.js)
          SUPABASE_KEY: sb_publishable_3aundU5m2MaTyz6PHiQaBg_tLXjqInj
        run: |
          curl -fsS --retry 3 --retry-delay 10 -X POST "$SUPABASE_URL/rest/v1/rpc/list_doctors" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}' \
            | head -c 200
